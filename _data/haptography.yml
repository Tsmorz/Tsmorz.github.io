  - { id: release, name: Release, unit: ms, min: 0, max: 200, step: 1, value: 20 }

# The Library tab. Each waveform is drawn by library-core.js from these parameters (all times in ms):
#   knock: a half-sine push `ms` wide, a reversed `brake` pulse (0-1) and an optional ringing tail
#          at `ring` Hz that dies away over `decay` ms at `tail` level: clicks and impacts.
#   tone:  a sine at `hz` (sweeping to `to`), `ms` long, `shape` flat/up/down/swell, `wobble` Hz.
#   noise: noise from `low` to `high` Hz, `ms` long, with `grain` Hz bumps or `stick` Hz stick-slip.
# Any entry: `repeat` hits, `gap` ms between their starts (one number or a list), `levels` per hit,
# and `level` (0-1) for the whole thing. The drive is then held inside the actuator's safe limits.
library_groups:
