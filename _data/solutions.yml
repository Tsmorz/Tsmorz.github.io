# Content for /solutions/. Edit here, not in solutions.md.
intro: >-
  I take on project-based work for companies with a robotics, estimation or controls problem.
  A clear scope, working code, results you can check.

services:
  - name: Estimation and fusion
    blurb: Kalman filters, IMU and GPS fusion, and SLAM that hold up on real sensors.
  - name: Controls and System ID
    blurb: From your recorded data to a model and a controller you can tune and trust.
  - name: Learning-based control
    blurb: Reinforcement learning for hard, underactuated systems, checked against a classical baseline.
  - name: Embedded prototypes
    blurb: Working ESP32 firmware, from sensor to browser dashboard.
  - name: Aerial vehicle design
    blurb: Sizing, aerodynamics and propulsion for small drones and RC aircraft.
  - name: Robot fleet software
    blurb: Over-the-air updates and low-latency teleoperation for deployed robots.

cta:
