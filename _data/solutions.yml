# Content for /solutions/. Edit here, not in solutions.md.
intro: >-
  I take on project-based work for companies with a robotics, estimation or controls problem.
  A clear scope, working code, results you can check.

services:
  - name: Embedded firmware
    blurb: Working ESP32 firmware, from sensor to browser dashboard. Camera streaming, AprilTag pose, IMU and GPS, live telemetry.
  - name: Modern and classical controls
    blurb: PID and LQR designs, models fitted to your recorded data, and learning-based control, all tried in simulation first.
  - name: Sensor fusion
    blurb: Kalman filters, IMU and GPS fusion, and SLAM, built to hold up on real, noisy sensors rather than only in clean simulation.

cta:
  heading: Have a problem in mind?
  text: Send a few lines on what you're trying to do. I'll reply with questions or a rough plan.
  subject: Project enquiry
