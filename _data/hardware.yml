# The "Hardware design" section under the cards on /projects/. Edit here, not in projects.md.
# `photos` sit in one row; `ratio` is width / height, so each photo keeps its shape. `text` is Markdown.
heading: Hardware design
photos:
  - src: /assets/img/about/bike-aerobar-cad.png
    alt: CAD model of a bike aerobar I designed
    ratio: 1.351
  - src: /assets/img/about/aerobar-bike-front.jpg
    alt: Front view of the aerobar mounted on my bike
    ratio: 0.75
  - src: /assets/img/about/aerobar-bike-deer.jpg
    alt: My bike with the aerobar, parked at a fence with deer behind it
    ratio: 0.667
text: >-
  In 2020 I designed, built, and raced on custom hardware for my bike. Aerobars are the
  extensions you rest your forearms on to ride low and cut through the wind. Modern aerodynamic
  road handlebars aren't round, so standard clamp-on aerobars don't fit them, and I needed
  something purpose-built. Aerobars give a big advantage in the moments that decide a race, so
  I knew the effort would be worthwhile. The design was inspired by an earlier product from
  Oval Concepts. It worked well for racing, but repeated-load testing showed the bolts would wear out and
  break too early for it to ever become a product. You can
  [view the 3D model in Onshape](https://cad.onshape.com/documents/7ba426488dc4cee808e2ab41/w/6d04e286156affca42996beb/e/86fb2f0a3aa78e48a1cfdd21?renderMode=0&uiState=6abe3bc36909f7bf5121492c)
  (you'll need a free Onshape account).
