    <p>A flight-test <strong>calibration</strong>, with a vane or a flow probe fitted once, gives the weights <code>w</code> with
    <code>&#945; &#8776; w&#183;x&#771;</code>. Afterwards, on a fresh elevator input, &#945; is read from the model driven by the same input (bottom plot). Calibration
    noise and a model order that is too low both cost accuracy.</p><p>In practice the calibration is a flight test, a test rig or a tachometer, done once. After it, the hard sensor can go. On an unstable
    plant, put the same model in a Kalman filter with the live outputs so errors do not build up, then read the hidden state from the filter&#8217;s
