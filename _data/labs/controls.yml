# /controls/ — the four original demos, on the lab template (see _includes/lab.html).
# Notes and hints carried over from the hand-built page; edit them here.
labs:
  msd:
    plant: msd
    controller: pid
  tilt:
    plant: tilt
    controller: pid
  flight:
    plant: flight
    controller: alt
  cartpole:
    plant: cartpole
    controller: lqg
    estimator: kalman
    noise: 0.5
    logQ: 0
tabs:
- id: msd
  label: Intro
  lab: msd
  top: sim
  row1: states
  row2: analysis
  analysis:
  - contrib
  - bode
  - nyquist
  - poles
  startManual: true
  zeroGains: true
  manualHint: <strong>Manual:</strong> drag the mass up or down. Delay and noise apply to PID only.
  hint: |-
    <strong>Stuck?</strong> A good solution is K<sub>p</sub>&#8201;=&#8201;40, K<sub>i</sub>&#8201;=&#8201;5, K<sub>d</sub>&#8201;=&#8201;6. A high K<sub>p</sub> tracks the sine closely, K<sub>d</sub> stops the spring from ringing, and a little K<sub>i</sub> removes the offset.
  rangeBoxes: true
  disturbances: true
  delayMax: 1000
  noiseMax: 0.5
  noiseUnit: m
  score:
    window: 5
    label: RMSE (m)
    unit: m
  predict:
    question: Set K<sub>p</sub> = 40 and leave K<sub>i</sub> and K<sub>d</sub> at zero. What will the mass do after a step?
    options:
    - Move to the new position and stop there
    - Ring around it and come to rest short of it
    - Run away, because the gain is too high
    answer: 1
    try: Switch to PID, pick Step, set K<sub>p</sub> to 40 and watch a few jumps.
    explain: Proportional action alone behaves like a stiffer spring. Nothing removes energy, so the mass rings, and the real spring pushes back with a force only an error can balance, so it stops short. K<sub>d</sub> adds the damping and K<sub>i</sub> the missing push.
  goal: Tune a PID so the mass tracks the reference without ringing, then see what delay, noise and a slow controller do to it.
  tasks:
  - Press <strong>PID</strong> and <strong>Load suggested gains</strong>, and watch it track the wave.
  - 'Set K<sub>i</sub> and K<sub>d</sub> to zero and raise K<sub>p</sub>: it rings. Bring K<sub>d</sub> back to stop it.'
  - Switch <strong>View</strong> to Bode and read the phase margin. Drag <strong>Delay</strong> up until the margin runs out, then watch the sim.
  - Slow the controller with <strong>Runs every</strong> until the readout says unstable.
  check:
    question: You add delay and the loop turns unstable. Which number on the margins readout told you how much delay it could take?
    options:
    - Gain up
    - Delay margin
    - Crossover
    answer: 1
    explain: A delay costs phase of &#969;T at crossover. The delay margin is the delay that uses up the whole phase margin, so past it the loop oscillates.
  controls:
  - mode
  - reference
  - hint
  - gains
  - delay
  - noise
  - ctrlrate
  - view
  - freq
  - margins
  - score
  - reset
  aria:
  - Mass-spring-damper simulation with the reference trajectory ahead
  - 'State history: position and velocity'
  - PID contribution chart
  note_title: About this demo
  note: |-
    <p>A <strong>PID</strong> controller tracks a reference with a lightly damped mass on a spring. The proportional term reacts
    to the error, the integral term removes offset, and the derivative term damps ringing. Start with K<sub>p</sub>, add
    K<sub>d</sub>, then a little K<sub>i</sub>. Then add <strong>delay</strong> (it eats phase margin) or <strong>noise</strong>
    (the derivative term amplifies it). The score is RMSE over the last 5&nbsp;s.</p>
- id: tilt
  label: Tilt Table
  lab: tilt
  top: sim
  row1: states
  row2: analysis
  analysis:
  - contrib
  - bode
  - nyquist
  - poles
  startManual: true
  zeroGains: true
  manualHint: <strong>Manual:</strong> drag the beam ends to tilt it. Delay and noise apply to PID only.
  hint: |-
    <strong>Stuck?</strong> A good solution is K<sub>p</sub>&#8201;=&#8201;3, K<sub>i</sub>&#8201;=&#8201;0, K<sub>d</sub>&#8201;=&#8201;2. Enough K<sub>p</sub> to chase the reference, and K<sub>d</sub> to brake the ball before it overshoots.
  rangeBoxes: true
  disturbances: true
  delayMax: 1000
  noiseMax: 0.5
  noiseUnit: m
  score:
    window: 8
    label: RMSE (m)
    unit: m
  predict:
    question: Give the tilt table K<sub>p</sub> = 3 and nothing else. What does the ball do?
    options:
    - Rolls to the target and stops
    - Swings past the target again and again, and the swings don't die out
    - Rolls straight off the end
    answer: 1
    try: Switch to PID, set K<sub>p</sub> to 3 with K<sub>i</sub> and K<sub>d</sub> at zero, and watch the ball.
    explain: Tilting the beam sets the ball's acceleration, not its speed, so proportional action alone is a spring with no damper. The servo's lag then eats the little phase that is left, and the swings grow until the ball rolls off. K<sub>d</sub> is the brake.
  goal: Hold a rolling ball at a target on a tilting beam, with a servo that can only turn so fast.
  tasks:
  - Press <strong>PID</strong> and <strong>Load suggested gains</strong>, and watch the ball chase the wave.
  - 'Set K<sub>d</sub> to zero and raise K<sub>p</sub>: the swings grow until the ball rolls off.'
  - Pick <strong>Step</strong> and watch &#952;&#775; hit the 60&nbsp;&#176;/s servo limit in the state plot.
  - Switch <strong>View</strong> to Poles and see where the poles move as you raise K<sub>d</sub>.
  check:
    question: What does the derivative term K<sub>d</sub> react to?
    options:
    - How far the ball is from the target
    - How fast the error is changing, so it brakes before overshooting
    - The sum of all past errors
    answer: 1
    explain: K<sub>d</sub> acts on the rate of change of the error. It is the damper that K<sub>p</sub> alone lacks; the integral term is the one that sums past error.
  controls:
  - mode
  - reference
  - hint
  - gains
  - delay
  - noise
  - view
  - freq
  - margins
  - score
  - reset
  aria:
  - 'Tilt table: a ball on a beam tilted by a servo'
  - 'State history: ball position and velocity, beam angle'
  - PID contribution chart
  note_title: About this demo
  note: |-
    <p>A <strong>PID</strong> controller tilts a beam so a ball tracks a reference (the dashed ring). A servo turns the beam at
    no more than 60&nbsp;&#176;/s, so watch &#952;&#775; saturate. K<sub>p</sub> alone oscillates, K<sub>d</sub> damps it, and a little
    K<sub>i</sub> removes offset. The run restarts if the ball rolls off an end.</p>
- id: flight
  label: Flight Sim
  lab: flight
  top: sim
  row1: states
  row2: analysis
  analysis:
  - contrib
  - bode
  - nyquist
  - poles
  startManual: true
  zeroGains: true
  manualHint: |-
    <strong>Manual:</strong> drag up to pitch the nose up, down for nose down; release to return to trim. Delay and noise apply to PID only.
  hint: |-
    <strong>Stuck?</strong> A good solution is K<sub>p</sub>&#8201;=&#8201;0.5, K<sub>i</sub>&#8201;=&#8201;0.1, K<sub>d</sub>&#8201;=&#8201;0.35. K<sub>d</sub> damps the climb rate, and K<sub>i</sub> holds the altitude against drift.
  rangeBoxes: true
  disturbances: true
  delayMax: 1000
  noiseMax: 0.5
  noiseUnit: m
  score:
    window: 6
    label: RMSE (m)
    unit: m
  goal: Make an aircraft hold or change altitude with the elevator, without stalling the wing.
  predict:
    question: The aircraft is below its target altitude and you use K<sub>p</sub> alone. What does it do?
    options:
    - Climbs and settles at the target
    - Climbs, overshoots and oscillates around it
    - Keeps descending
    answer: 1
    try: Switch to PID, set K<sub>p</sub> with K<sub>i</sub> and K<sub>d</sub> at zero, and pick Step.
    explain: Altitude only changes through pitch and flight-path angle, so there is lag between the elevator and the climb. Proportional action alone overshoots; K<sub>d</sub> on climb rate damps it.
  tasks:
  - Press <strong>PID</strong> and <strong>Load suggested gains</strong>, and watch the altitude track the wave.
  - Pick <strong>Step</strong> and compare K<sub>p</sub> alone with K<sub>p</sub> plus K<sub>d</sub>.
  - Raise all the gains until the wing stalls, then back off.
  - Switch <strong>View</strong> to Nyquist and see how close the curve gets to &#8722;1 as you raise K<sub>p</sub>.
  check:
    question: You push the gains much too high. What happens to the aircraft?
    options:
    - 'Nothing: the elevator command is clamped'
    - The wing stalls and it loses altitude
    - It flies faster but stays level
    answer: 1
    explain: Lift drops sharply past about 16&#176; angle of attack. A harder pull makes the angle bigger, so past the limit more command means less lift.
  controls:
  - mode
  - reference
  - hint
  - gains
  - delay
  - noise
  - view
  - freq
  - margins
  - score
  - reset
  aria:
  - 2D flight simulator
  - 'State history: altitude, airspeed, pitch and angle of attack'
  - 'PID contribution chart: elevator command'
  note_title: About this demo
  note: |-
    <p>A <strong>PID autopilot</strong> tracks an altitude reference by moving the elevator away from trim. Altitude can only
    change through pitch and flight-path angle, so K<sub>p</sub> alone oscillates; K<sub>d</sub> on climb rate damps it. Push too
    hard and the wing stalls. In Manual the canvas is a control stick.</p>
    </div>
    <div class="demo-note">
    <h4 class="demo-note-title">Equations of motion</h4>
          <div class="eqn-block">
            <div class="eqn-row"><span class="eqn-lhs">V&#775;</span><span class="eqn-eq">=</span><span class="eqn-rhs">[T cos&#945; &#8722; D] / m &#8722; g sin&#947;</span></div>
            <div class="eqn-row"><span class="eqn-lhs">&#947;&#775;</span><span class="eqn-eq">=</span><span class="eqn-rhs">[T sin&#945; + L &#8722; mg cos&#947;] / (mV)</span></div>
            <div class="eqn-row"><span class="eqn-lhs">&#945;&#775;</span><span class="eqn-eq">=</span><span class="eqn-rhs">q &#8722; &#947;&#775;</span></div>
            <div class="eqn-row"><span class="eqn-lhs">q&#775;</span><span class="eqn-eq">=</span><span class="eqn-rhs">M<sub>y</sub> / I<sub>yy</sub></span></div>
            <div class="eqn-row"><span class="eqn-lhs">h&#775;</span><span class="eqn-eq">=</span><span class="eqn-rhs">V sin&#947;</span></div>
            <div class="eqn-row"><span class="eqn-lhs">x&#775;</span><span class="eqn-eq">=</span><span class="eqn-rhs">V cos&#947;</span></div>
            <p class="eqn-note">L, D, M<sub>y</sub> from nonlinear aero (sigmoid stall ~16&#176;). T = trim thrust. RK4 at 200 Hz.</p>
          </div>
    </div>
    <div class="demo-note">
    <h4 class="demo-note-title">PID autopilot</h4>
          <div class="eqn-block">
            <div class="eqn-row"><span class="eqn-lhs">e</span><span class="eqn-eq">=</span><span class="eqn-rhs">h<sub>ref</sub>(t) &#8722; h<sub>meas</sub>,&#160;&#160; h<sub>ref</sub> = 23 + 6 sin(2&#960;t / 16)&#160;m</span></div>
            <div class="eqn-row"><span class="eqn-lhs">u</span><span class="eqn-eq">=</span><span class="eqn-rhs">K<sub>p</sub>e + K<sub>i</sub>&#8747;e&#8202;dt + K<sub>d</sub>&#8202;&#279;&#160;&#160;&#160;(nose-up command, &#176;)</span></div>
            <div class="eqn-row"><span class="eqn-lhs">&#948;<sub>e</sub></span><span class="eqn-eq">=</span><span class="eqn-rhs">&#948;<sub>e,trim</sub> &#8722; u</span></div>
            <p class="eqn-note">Elevator clamped &#177;15&#176; and slew-limited to 40&#176;/s. The run resets on a crash, a stall, a loop, or a climb past 590&#160;m. The score is altitude RMSE over the last 6 s.</p>
          </div>
  sprite: /assets/img/controls/cessna.png
- id: cartpole
  label: Cart-Pole
  lab: cartpole
  top: sim
  row1: est-states
  row2: analysis
  analysis:
  - contrib
  - bode
  - nyquist
  - poles
  startManual: true
  zeroGains: true
  manualHint: <strong>Manual:</strong> drag the cart. Delay and noise apply to the controller only.
  hint: |-
    <strong>Stuck?</strong> A good solution is k<sub>x</sub>&#8201;=&#8201;3.1, k<sub>&#7819;</sub>&#8201;=&#8201;5.9, k<sub>&#952;</sub>&#8201;=&#8201;43.5, k<sub>&#952;&#775;</sub>&#8201;=&#8201;18.1. These are the LQR gains. The pole terms keep it up and the cart terms pull it back to the middle.
  rangeBoxes: true
  disturbances: true
  delayMax: 1000
  noiseMax: 2
  noiseUnit: °
  score:
    window: 10
    label: RMSE (m)
    unit: m
  predict:
    question: The LQR is told to move the cart 1 m to the right. Which way does the cart move first?
    options:
    - Right, straight away
    - Left for a moment, then right
    - Nowhere until the pole starts to tip
    answer: 1
    try: Switch to LQR, press Load LQR gains, pick Step and watch the cart at each jump.
    explain: To travel right with the pole upright, the pole has to lean right first, and the only way to tip it right is to pull its base left. Systems that start off the wrong way are called non-minimum phase, and they limit how fast any controller can be.
  goal: Balance an unstable pole on a cart using only two noisy sensors, and see what the estimator costs.
  tasks:
  - Press <strong>LQR</strong> and <strong>Load LQR gains</strong>, and watch it balance.
  - 'Raise <strong>Sensor noise</strong> to 2&#176; with <strong>Differencing</strong> on: the pole falls. Switch to <strong>Kalman filter</strong>: it holds.'
  - Slide <strong>Trust</strong> from model to sensors and watch the rate estimate get noisier.
  - 'Switch <strong>View</strong> to Poles: four of the eight poles are the filter''s and only they move with Trust. Check the margins readout.'
  check:
    question: At 2&#176; of noise, why does differencing drop the pole while the Kalman filter does not?
    options:
    - Differencing divides noise by a tiny time step, so the rate estimate is useless
    - The Kalman filter uses a stronger controller
    - Differencing only measures the cart
    answer: 0
    explain: A reading off by half a degree, divided by 25&nbsp;ms, is a rate off by about 20&nbsp;&#176;/s. The Kalman filter uses the model to smooth that out.
  controls:
  - mode
  - reference
  - hint
  - gains
  - delay
  - noise
  - estimator
  - view
  - freq
  - margins
  - score
  - reset
  aria:
  - Cart-pole balancing simulation. With a controller running, drag to move the reference.
  - Measured and true pole angle, and estimated and true rates
  - Each gain's contribution to the force
  note_title: About this demo
  note: |-
    <p>The <strong>cart-pole</strong> is unstable: with no control the pole falls in a second or two. One force must hold
    the pole angle and the cart position, so the force is a weighted sum of four states (<strong>full-state feedback</strong>).
    Only the cart position and pole angle are measured, so the two rates are <strong>estimated</strong>: by <strong>differencing</strong>
    readings (noise gets amplified) or by a <strong>Kalman filter</strong> (a model of the plant corrected by the sensors, with a
    <strong>trust</strong> slider). Raise the noise and compare. <strong>Load LQR gains</strong> fills in the optimal set. Switch
    <strong>View</strong> to Bode, Nyquist or Poles: the filter is part of the loop, and LQR's guaranteed margins are gone (Doyle, 1978).</p>
    </div>
    <div class="demo-note">
    <h4 class="demo-note-title">Equations of motion &amp; control law</h4>
          <div class="eqn-block">
            <div class="eqn-row"><span class="eqn-lhs">&#952;&#776;</span><span class="eqn-eq">=</span><span class="eqn-rhs">[g sin&#952; &#8722; cos&#952;&#183;&#964;] / [&#8467;(4/3 &#8722; m cos&#178;&#952; / (M+m))]</span></div>
            <div class="eqn-row"><span class="eqn-lhs">x&#776;</span><span class="eqn-eq">=</span><span class="eqn-rhs">&#964; &#8722; m&#8467;&#952;&#776; cos&#952; / (M+m),&#160;&#160; &#964; = [F &#8722; b&#7819; + m&#8467;&#952;&#775;&#178; sin&#952;] / (M+m)</span></div>
            <div class="eqn-row" style="align-items:center"><span class="eqn-lhs">F</span><span class="eqn-eq">=</span><span class="eqn-rhs"><span class="mx mx-row"><span>k<sub>x</sub></span><span>k<sub>&#7819;</sub></span><span>k<sub>&#952;</sub></span><span>k<sub>&#952;&#775;</sub></span></span><span class="mx mx-col"><span>x</span><span>&#7819;</span><span>&#952;</span><span>&#952;&#775;</span></span>&#160;&#160;=&#160;&#160;&#8722;K&#8201;<b>s</b>,&#160;&#160; <b>s</b> =<span class="mx mx-col"><span>x</span><span>&#7819;</span><span>&#952;</span><span>&#952;&#775;</span></span></span></div>
            <p class="eqn-note">Linearised about upright (small &#952;), with this cart-pole's numbers. Q and R weight state error against force; the Riccati solution for them gives K.</p>
            <div class="eqn-row" style="align-items:center"><span class="eqn-lhs">s&#775;</span><span class="eqn-eq">=</span><span class="eqn-rhs"><span class="mx mx-grid" style="grid-template-columns:repeat(4,auto)"><span>0</span><span>1</span><span>0</span><span>0</span><span>0</span><span>&#8722;2.13</span><span>&#8722;5.89</span><span>0</span><span>0</span><span>0</span><span>0</span><span>1</span><span>0</span><span>1.07</span><span>7.85</span><span>0</span></span><span class="mx mx-col"><span>x</span><span>&#7819;</span><span>&#952;</span><span>&#952;&#775;</span></span> + <span class="mx mx-col"><span>0</span><span>2.67</span><span>0</span><span>&#8722;1.33</span></span>F</span></div>
            <div class="eqn-row" style="align-items:center"><span class="eqn-lhs">Q</span><span class="eqn-eq">=</span><span class="eqn-rhs"><span class="mx mx-grid" style="grid-template-columns:repeat(4,auto)"><span>1</span><span>0</span><span>0</span><span>0</span><span>0</span><span>0.1</span><span>0</span><span>0</span><span>0</span><span>0</span><span>10</span><span>0</span><span>0</span><span>0</span><span>0</span><span>0.1</span></span>,&#160;&#160; R = 0.1</span></div>
            <div class="eqn-row" style="align-items:center"><span class="eqn-lhs">K</span><span class="eqn-eq">=</span><span class="eqn-rhs"><span class="mx mx-row"><span>&#8722;3.1</span><span>&#8722;5.9</span><span>&#8722;43.5</span><span>&#8722;18.1</span></span>,&#160;&#160; F = &#8722;K<b>s</b></span></div>
            <p class="eqn-note">M = 0.3 kg cart, m = 0.3 kg pole, &#8467; = 1.5 m half-length, b = 0.8 N&#183;s/m cart friction, g = 9.81 m/s&#178;. Force saturates at &#177;10 N; LQR's K comes out negative in every entry (u = &#8722;K<b>s</b>), so the sliders show &#8722;K and all four gains are positive. &#952; is in rad, measured from vertical. The trial ends when |&#952;| &gt; 45&#176; or the cart hits a rail end at &#177;4 m. RK4 at 200 Hz.</p>
          </div>
  loadLabel: Load LQR gains
