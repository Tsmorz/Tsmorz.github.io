  manualHint: <strong>Manual:</strong> drag the beam ends to tilt it. Delay and noise apply to PID only.
  hint: <strong>Stuck?</strong> A good solution is K<sub>p</sub>&#8201;=&#8201;3, K<sub>i</sub>&#8201;=&#8201;0, K<sub>d</sub>&#8201;=&#8201;2. Enough K<sub>p</sub> to chase the reference, and K<sub>d</sub> to brake the ball before it overshoots.
  rangeBoxes: true
  disturbances: true
  delayMax: 1000
  noiseMax: 0.5
  noiseUnit: m
  score:
    window: 8
    label: RMSE (m)
    unit: m
  predict:
    question: Give the tilt table K<sub>p</sub> = 3 and nothing else. What does the ball do?
    options:
    - Rolls to the target and stops
    - Swings past the target again and again, and the swings don't die out
    - Rolls straight off the end
    answer: 1
    try: Switch to PID, set K<sub>p</sub> to 3 with K<sub>i</sub> and K<sub>d</sub> at zero, and watch the ball.
    explain: Tilting the beam sets the ball's acceleration, not its speed, so proportional action alone is a spring with no damper. The servo's lag then eats the little phase that is left, and the swings grow until the ball rolls off. K<sub>d</sub> is the brake.
  goal: Hold a rolling ball at a target on a tilting beam, with a servo that can only turn so fast.
  tasks:
  - Press <strong>PID</strong> and <strong>Load suggested gains</strong>, and watch the ball chase the wave.
  - 'Set K<sub>d</sub> to zero and raise K<sub>p</sub>: the swings grow until the ball rolls off.'
  - Pick <strong>Step</strong> and watch &#952;&#775; hit the 60&nbsp;&#176;/s servo limit in the state plot.
  - Switch <strong>View</strong> to Poles and see where the poles move as you raise K<sub>d</sub>.
  check:
  - question: What does the derivative term K<sub>d</sub> react to?
    options:
    - How far the ball is from the target
    - How fast the error is changing, so it brakes before overshooting
    - The sum of all past errors
    answer: 1
    explain: K<sub>d</sub> acts on the rate of change of the error. It is the damper that K<sub>p</sub> alone lacks; the integral term is the one that sums past error.
    why:
    - The proportional term reacts to distance.
    - ''
    - That describes the integral term.
  - question: The tilt table and the mass-spring both have PID loops. Which one has a spring pulling it back by itself?
    options:
    - The mass-spring
    - The tilt table
    - Both
    answer: 0
    explain: 'A ball on a beam has no restoring force of its own: tilting sets acceleration, so a lone K<sub>p</sub> is a spring with no damper.'
    why:
    - ''
    - Tilting the beam only sets how fast the ball speeds up.
    - Only the mass-spring has a real spring.
  controls:
  - mode
  - reference
  - hint
  - gains
  - delay
  - noise
  - view
  - freq
  - margins
  - score
  - reset
  aria:
  - 'Tilt table: a ball on a beam tilted by a servo'
  - 'State history: ball position and velocity, beam angle'
  - PID contribution chart
  note_title: About this demo
  note: |-
    <p>A <strong>PID</strong> controller tilts a beam so a ball tracks a reference (the dashed ring). A servo turns the beam at
    no more than 60&nbsp;&#176;/s, so watch &#952;&#775; saturate. K<sub>p</sub> alone oscillates, K<sub>d</sub> damps it, and a little
