    - Differencing only measures the cart
    answer: 0
    explain: A reading off by half a degree, divided by 25&nbsp;ms, is a rate off by about 20&nbsp;&#176;/s. The Kalman filter uses the model to smooth that out.
    why:
    - ''
    - The Kalman filter uses the same gains as the LQR.
    - Differencing measures both the cart and the pole.
  - question: The Bode plot of the LQR loop shows plenty of margin, but the real cart-pole fails with the filter in. Why?
    options:
