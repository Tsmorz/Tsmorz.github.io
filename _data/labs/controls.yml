  note_title: Label the states by calibration
  note: |-
    <p>One tap of the linearized cart-pole, measured only through the cart position and the pole angle, is enough for Ho&#8211;Kalman to find
    that the system has <strong>four</strong> states (the bars). But the realized states are not x, &#7819;, &#952; and &#952;&#775;: each physical state is a
    different mix of them (the map). Nothing in the tap says which realized state is the velocity.</p>
    <p>A short <strong>calibration</strong> fixes that: excite the plant while measuring the hard state once, and fit one row of weights
    <code>w</code> so that <code>state &#8776; w&#183;x&#771;</code>. Afterwards, on a fresh input, the state is read from the model alone (bottom plot).
    More calibration noise means a worse <code>w</code>; a model order too small loses part of the state.</p><p>In practice the calibration is a flight test, a test rig or a tachometer, done once. After it, the hard sensor can go. On an unstable
    plant, put the same model in a Kalman filter with the live outputs so errors do not build up, then read the hidden state from the filter&#8217;s
    realized states with the same weights.</p>
