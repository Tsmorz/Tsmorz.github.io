  note_title: Label the states by calibration
  note: |-
    <p>Measured through airspeed and altitude only, one elevator tap of the linearized aircraft reveals <strong>five</strong> observable states (the bars;
    the sixth, the distance flown, does not affect either measurement). The realized states are mixes of V, &#947;, &#945;, q and h: the map has no row that
