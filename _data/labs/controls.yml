  - question: Why do the realized states not line up with the physical ones?
    options:
    - Input and output data only fix the model up to a change of basis
    - The cart-pole is nonlinear
    - The singular values are too small
    answer: 0
    explain: Any invertible T gives the same input-output behavior, so Ho–Kalman can return any of them; it returns a balanced one.
    why:
    - ''
    - 'Nonlinearity is not the cause here: the model is linear.'
    - The size of the singular values only sets the order.
