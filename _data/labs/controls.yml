  label: Verify a network
  lab: net
  top: sim
  row1: verify-map
  row2: verify-proof
  controls:
  - controller
  - noise
  - verify
  noiseMax: 2
  noiseUnit: °
  aria:
  - The cart-pole, balanced by the LQR or the neural network
  - The network's force over pole angle and rate, and where its robustness is proved
  - The proof against sampled inputs, the split box, and the bound's width by layer
  note: |-
    <p>The small network trained to copy the cart-pole's LQR. Verification proves something for <em>every</em> input in a region:
    can a sensor error up to &#949; on the angle move the force by more than &#948;? <strong>Interval bound propagation</strong> pushes the whole
    box through the network. The answer is <strong>proved</strong>, <strong>disproved</strong> (with a counterexample) or <strong>unknown</strong>;
    split the box and bound each piece to tighten it (<strong>branch and bound</strong>). The right map runs the proof at every
    state.</p>
  demo: cartpole
  minutes: 8
  goal: Prove what a neural-network controller will do, instead of watching it balance and hoping.
  recall: LQR gains are a short list of numbers you can analyze. A network that copies them is not.
  predict:
    question: A sensor error moves the angle by &#949;. Can bounds on the network's output be proved for every error up to &#949;?
    options:
    - Yes, for the whole region
    - Only for the errors you tried
    - Never
    answer: 0
    try: Switch the controller to the <strong>Neural net</strong> and read the verdict.
    explain: Interval bound propagation pushes the whole box of inputs through the network, so its answer covers every input in the region.
  tasks:
  - Switch <strong>Controller</strong> to the neural net and watch it balance.
  - 'Read the answer to the question: proved, disproved or unknown?'
  - Raise <strong>Split</strong> to tighten the bound. Does an unknown become a proof?
  - 'Look at the map: where is the force provably unaffected?'
  note_title: Proving what a network will do
  check:
  - question: Why does splitting the box help?
    options:
    - Bounds on small pieces are tighter than one bound on the whole box
    - It makes the network smaller
    - It adds noise
    answer: 0
    explain: Interval bounds add slack at each layer. Smaller input boxes have less slack, so more questions become provable.
    why:
    - ''
    - The network is unchanged.
    - Splitting only changes how the box is bounded.
  recap: say what a verified bound promises and how branch and bound tightens it.
  needs:
  - cartpole
problem: 'A 1&nbsp;kg mass hangs on a spring with light damping and has to follow a moving position. Every lesson in the first row uses this one mass: tune it, check it is stable, fit a model of it from data, feed back its states, estimate its speed, run the controller on a computer, design it against requirements, and finish with your own recording. Then the same steps on a tilt table, an aircraft and a cart-pole.'
