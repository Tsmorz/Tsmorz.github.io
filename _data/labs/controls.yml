tabs:
- id: msd
  label: Tune
  lab: msd
  top: sim
  row1: states
  row2: contrib
  startManual: true
  zeroGains: true
  manualHint: <strong>Manual:</strong> drag the mass up or down. Delay and noise apply to PID only.
  hint: <strong>Stuck?</strong> A good solution is K<sub>p</sub>&#8201;=&#8201;40, K<sub>i</sub>&#8201;=&#8201;5, K<sub>d</sub>&#8201;=&#8201;6. A high K<sub>p</sub> tracks the sine closely, K<sub>d</sub> stops the spring from ringing, and a little K<sub>i</sub> removes the offset.
  rangeBoxes: true
  disturbances: true
  delayMax: 1000
  noiseMax: 0.5
  noiseUnit: m
  score:
    window: 5
    label: RMSE (m)
    unit: m
  predict:
    question: Set K<sub>p</sub> = 40 and leave K<sub>i</sub> and K<sub>d</sub> at zero. What will the mass do after a step?
    options:
    - Move to the new position and stop there
    - Ring around it and come to rest short of it
    - Run away, because the gain is too high
    answer: 1
    try: Switch to PID, pick Step, set K<sub>p</sub> to 40 and watch a few jumps.
    explain: Proportional action alone behaves like a stiffer spring. Nothing removes energy, so the mass rings, and the real spring pushes back with a force only an error can balance, so it stops short. K<sub>d</sub> adds the damping and K<sub>i</sub> the missing push.
  goal: Tune a PID so the mass tracks the reference without ringing, then see what delay and noise do to it.
  tasks:
  - Press <strong>PID</strong> and <strong>Load suggested gains</strong>, and watch it track the wave.
  - 'Set K<sub>i</sub> and K<sub>d</sub> to zero and raise K<sub>p</sub>: it rings. Bring K<sub>d</sub> back to stop it.'
  - 'Pick <strong>Step</strong> and add a little K<sub>i</sub>: what does it remove?'
  - Add <strong>Delay</strong> until it starts to oscillate. How much could it take?
  check:
  - question: You add delay and the tuned loop starts to oscillate. Which stability measure says how much delay it could take?
    options:
    - Gain margin
    - Delay margin
    - Settling time
    answer: 1
    explain: A delay costs phase of &#969;T at crossover. The delay margin is the delay that uses up the whole phase margin; the next lesson reads it off a plot.
    why:
    - Gain margin is how much more gain it tolerates.
    - ''
    - Settling time is a property of the response, not a limit.
  - question: A PID makes a stiff, heavy cart track well. You swap in a lighter cart with the same gains and it rings. What changed?
    options:
    - The loop gain is higher, so the phase margin is smaller
    - The integral term stopped working
    - The reference got faster
    answer: 0
    explain: A lighter mass makes the same gains act harder, which raises the crossover and eats phase margin. The View toggle shows it as a smaller phase margin.
    why:
    - ''
    - 'The integral term is unchanged: it still sums error.'
    - The reference is the same; the plant is what changed.
  controls:
  - mode
  - reference
  - hint
  - gains
  - delay
  - noise
  - score
  - reset
  aria:
  - Mass-spring-damper simulation with the reference trajectory ahead
  - 'State history: position and velocity'
  - PID contribution chart
  note_title: About this demo
  note: |-
    <p>A <strong>PID</strong> controller tracks a reference with a lightly damped mass on a spring. The proportional term reacts
    to the error, the integral term removes offset, and the derivative term damps ringing. Start with K<sub>p</sub>, add
    K<sub>d</sub>, then a little K<sub>i</sub>. Then add <strong>delay</strong> (it eats phase margin) or <strong>noise</strong>
    (the derivative term amplifies it). The score is RMSE over the last 5&nbsp;s.</p>
  demo: msd
  minutes: 10
  recap: tune a PID by eye, and say what each term does.
  needs: []
  recall: You already know a spring pulls back and a damper slows things down. That is all this mass is, and a controller has to work with it.
- id: stable
  label: Is it stable?
  demo: msd
  lab: stab
  minutes: 8
  top: sim
  row1: time
  row2: analysis
  analysis:
  - bode
  - nyquist
  - poles
  controls:
  - reference
  - gains
  - delay
  - view
  - freq
  - margins
  aria:
  - The mass-spring-damper under PID control
  - Position, reference and force over time
  - 'Loop analysis: Bode, Nyquist or poles'
  goal: Read how stable the tuned loop is, and how much delay or gain it can take, from its frequency response.
  recall: You tuned the loop by watching the response. A loop can look fine and still be a delay away from oscillating.
  predict:
    question: You add 100 ms of delay to the tuned loop. What happens to its phase margin?
    options:
    - It shrinks
    - It grows
    - It does not change
    answer: 0
    try: Pick <strong>Bode</strong>, then drag <strong>Delay</strong> from 0 to 100 ms.
    explain: 'A delay changes when the signal arrives, not how big it is: it has gain 1 and phase &#8722;&#969;T. The phase loss grows with frequency, so the margin shrinks.'
  note_title: Cut the loop open
  note: <p>Cut the loop at the force. The <strong>loop gain</strong> L(s)&#8201;=&#8201;C(s)G(s) is one trip round the loop; if it comes back inverted at the same size (0&nbsp;dB, &#8722;180&#176;) the loop oscillates by itself. <strong>Phase</strong>, <strong>gain</strong> and <strong>delay margin</strong> say how far you are. <strong>Nyquist</strong> draws the same numbers as one curve that must keep clear of &#8722;1; <strong>Poles</strong> shows the closed loop's own motions, and you can drag one to place it.</p>
  tasks:
  - Pick <strong>Bode</strong> and read the phase margin and crossover on the readout.
  - Drag <strong>Delay</strong> up to the delay margin and watch the sim start to oscillate.
  - 'Switch <strong>View</strong> to Nyquist: how close does the curve get to &#8722;1?'
  - 'Switch to <strong>Poles</strong> and drag a closed-loop pole: the gains follow.'
  check:
  - question: On the Nyquist plot the curve passes exactly through &#8722;1. What does the loop do?
    options:
    - Oscillates forever at that frequency
    - Settles faster
    - Nothing special
    answer: 0
    explain: 'Passing through &#8722;1 means gain 1 and phase &#8722;180&#176;: the signal returns inverted and the same size, so it sustains itself.'
    why:
    - ''
    - Faster settling is a different property.
    - It is the exact condition for sustained oscillation.
  - question: Which poles make the closed loop unstable?
    options:
    - Any with a positive real part
    - Any with a large imaginary part
    - Any close to the origin
    answer: 0
    explain: A pole in the right half-plane grows exponentially. A large imaginary part only means it rings faster.
    why:
    - ''
    - Ringing fast is not growing.
    - Close to the origin means slow, not unstable.
  recap: read phase, gain and delay margin off a Bode plot and say what a Nyquist curve near &#8722;1 means.
  needs:
  - msd
- id: arx
  label: 'Fit: least squares'
  lab: fit
  top: sysid-replay
  row1: sysid-data
  row2: sysid-bode
  controls:
  - sysid
  aria:
  - The mass replaying the identification experiment
  - The input, the noisy measurement, and the fitted model's prediction
  - Bode plot of the true plant and the fitted model
  note_title: Fit a difference equation by least squares
  note: |
    <p>Record input and output, then find the difference equation that best predicts each output sample from the
    ones before it. That is linear in the unknowns, so one least-squares solve finds them. It is biased by sensor
    noise, so the fit is refined with <strong>instrumental variables</strong>. A 2nd-order fit reads back as m, c
    and k; a 3rd or 4th keeps its slowest oscillating pair (marked <strong>*</strong>); a 1st cannot oscillate, so there
    is nothing to read. A step barely excites the resonance, so try a chirp or random input.</p>
  demo: msd
  minutes: 8
  goal: Recover the mass, damper and spring from nothing but a recorded force and position.
  recall: On the tuning lesson the constants were handed to you. On real hardware they are not.
  predict:
    question: You fit a 1st-order model to a mass on a spring. What does its Bode plot miss?
    options:
    - 'Nothing: it matches'
    - The resonance, because a 1st-order model cannot ring
    - The DC gain
    answer: 1
    try: Pick <strong>Chirp</strong>, set <strong>1st</strong> order and press <strong>Run experiment</strong>.
    explain: One pole cannot oscillate, so the model has no resonant peak. A mass on a spring needs at least 2nd order.
  tasks:
  - Pick <strong>Chirp</strong>, <strong>2nd</strong> order and press <strong>Run experiment</strong>. How close are m, c and k to 1, 0.4 and 4?
  - Switch the input to <strong>Step</strong> and run again. Which estimate gets worse?
  - Raise <strong>Sensor noise</strong> and run again. How does the fit change?
  - 'Set <strong>4th</strong> order: the fit rises, but is it a better model? Read the <strong>*</strong> note.'
  check:
  - question: Why does a step input give a poor damping estimate?
    options:
    - A step barely excites the resonance, so the data say little about damping
    - Least squares cannot use a step
    - A step adds more sensor noise
    answer: 0
    explain: Damping shows in how a system rings. A step is one jump, so the record holds little ringing to measure.
    why:
    - ''
    - Least squares uses any input; it is the information in it that matters.
    - Noise is the same; the signal is what is thin.
  - question: A higher order always fits the recorded data better. Why not use the highest order?
    options:
    - It starts fitting the noise, so it predicts new data worse
    - It runs slower in the browser
    - It cannot be read as m, c and k
    answer: 0
    explain: Extra poles let the model chase noise. A good fit on old data is not a good model; the last lesson in this row checks on data held back.
    why:
    - ''
    - Speed is not the problem.
    - It can be read, using its slowest oscillating pair.
  recap: fit a mass-spring-damper from data and say why the input signal and the model order matter.
  needs:
  - stable
- id: era
  label: 'Fit: Ho–Kalman'
  lab: fit
  method: era
  top: id-replay
  row1: id-era
  row2: analysis
  controls:
  - idrun
  - view
  aria:
  - The mass replaying a hammer tap
  - The Hankel matrix of the impulse response, its singular values, and the measured and realized impulse responses
  - Estimated mass, damping and spring against the true values, the hidden states, or three methods compared
  note_title: Realize a state-space model from the impulse response
  note: |-
    <p>You can only see the position. But a mass on a spring has a second, unseen state, its velocity, and the position's future depends
    on both. <strong>Ho&#8211;Kalman</strong> (1966) says that if one tap gives you the whole ringing record, a state-space model that
    reproduces it is already hidden in the numbers.</p>
    <p><strong>1. Record the impulse response.</strong> The positions after the tap, h<sub>1</sub>, h<sub>2</sub>, &#8230;, are the
    <em>Markov parameters</em>. Any linear model x<sup>+</sup>&#8201;=&#8201;Ax&#8201;+&#8201;Bu, y&#8201;=&#8201;Cx has h<sub>k</sub>&#8201;=&#8201;CA<sup>k&#8722;1</sup>B.</p>
    <p><strong>2. Stack them into a Hankel matrix</strong>, each row the one above shifted by one sample (the diagonal stripes in the heatmap).
    It factors into what the output can see of the states times what the input can reach, so its <em>rank</em> is the number of states.
    The <strong>singular values</strong> show that rank: two are large, the rest are noise.</p>
    <p><strong>3. Keep those and read off the model.</strong> The factors give B, C and, from the shifted matrix, A. The dashed curve is the
    model's own impulse response.</p>
    <p><strong>4. What the unseen states are.</strong> They are not position and velocity. Any invertible mixing T gives a model with
    identical input and output, so data alone cannot say which coordinates are &#8220;real&#8221;. Ho&#8211;Kalman returns one particular
    choice, a <em>balanced</em> one, where the states are equally easy to reach and to see. Switch the lower plot to
    <strong>Hidden states</strong>: each realized state is a fixed mix of the true position and velocity, and the model has the same poles.
    To read m, c and k the panel maps the model back to a second-order mass-spring form.</p>
    <p>One limit: only the part of the system that is both reachable by the input and visible in the output can be recovered. A state
    that cannot be moved or cannot be seen leaves no trace in the tap.</p>
    <p><strong>Compare methods</strong> fits the same noisy recording three ways. With clean data, least squares and state-space least squares
    (measuring position and velocity) are exact, and Ho&#8211;Kalman starts a few percent off because its impulse response is truncated. Add sensor noise
    and the picture flips: least squares on noisy states is <em>biased</em> (its regressors carry the noise), the output-only ARX fit drifts, and Ho&#8211;Kalman,
    which keeps only the large singular values, barely moves.</p>
    <p>The <strong>next lesson</strong> drives the change of basis directly; the aircraft and cart-pole lessons use it to read states that have no sensor.</p>
  demo: msd
  minutes: 10
  goal: Build a state-space model from one tap, and see what its unseen states are.
  recall: Least squares made you choose the model order and only ever used the measured position. Can the data tell you the order, and what the unseen states are?
  predict:
    question: You tap the mass once and look at the singular values of the Hankel matrix. How many are large?
    options:
    - One
    - Two
    - Four
    answer: 1
    try: Press <strong>Tap it</strong> and look at the bars.
    explain: A mass on a spring has two states (position and velocity), and the number of large singular values is the number of states.
  tasks:
  - Press <strong>Tap it</strong> with 2 bars kept. How many bars stand out?
  - Raise <strong>Sensor noise</strong> and tap again. What happens to the gap after the 2nd bar?
  - Switch <strong>View</strong> to Hidden states. How closely does the fixed mix of position and velocity match each realized state?
  - Switch <strong>View</strong> to Compare methods and sweep the sensor noise from 0 to 100 mm. Which method wins at each end?
  - Keep 1 bar, then 4. What do m, c and k read, and why does Hidden states need exactly 2?
  check:
  - question: What does the size of the gap in the singular values tell you?
    options:
    - The number of states in the system
    - The sensor noise level
    - The sample time
    answer: 0
    explain: The rank of the Hankel matrix is the number of states, and the singular values show it. Noise fills the gap, which is why cutting there takes judgment.
    why:
    - ''
    - Noise sets the floor, but the gap itself marks the order.
    - The sample time is fixed here.
  - question: The realized states are not position and velocity. Why is that not a problem?
    options:
    - Any invertible mixing of the states gives the same input-output behavior
    - Ho–Kalman secretly measures velocity
    - The states are never used
    answer: 0
    explain: (A, B, C) and (TAT⁻¹, TB, CT⁻¹) produce the same impulse response, so the data fix the model only up to a change of coordinates. Poles, margins and simulations do not depend on T.
    why:
    - ''
    - Only the position is measured.
    - They are used; their coordinates are just arbitrary.
  - question: A state the input can never move. What does Ho–Kalman do with it?
    options:
    - 'Cannot find it: it leaves no trace in the tap'
    - Finds it with a small singular value
    - Reports it as noise
    answer: 0
    explain: The Hankel matrix only holds what is both reachable by the input and visible in the output. A hidden, unreachable state adds nothing to it.
    why:
    - ''
    - A state with no effect on the record has no singular value at all.
    - It would not even appear as noise.
  - question: At high sensor noise, which fit holds up best, and why?
    options:
    - 'Ho–Kalman: it keeps only the large singular values, so noise is discarded'
    - 'Plain state least squares: it uses more signals'
    - They are all identical
    answer: 0
    explain: With noisy states on both sides of the regression, plain least squares is biased and the output-only ARX fit drifts. Truncating the Hankel matrix to its large singular values removes most of the noise, so Ho–Kalman barely moves.
    why:
    - ''
    - State least squares has the noisy states in its regressors, which biases it; more signals does not cure that.
    - They agree only without noise.
  recap: build a state-space model from one tap, find the order from the singular values, say why its states are only defined up to a change of coordinates, and say when Ho–Kalman beats least squares.
  needs:
  - arx
  analysis:
  - id-result
  - id-hidden
  - id-vs
  maths: |-
    <p>Impulse response: <code>h<sub>k</sub> = C A<sup>k&#8722;1</sup> B</code>.</p>
    <p>Hankel matrix: <code>H = [h<sub>i+j&#8722;1</sub>] = &#120106; &#120094;</code>, with observability <code>&#120106; = [C; CA; CA&#178;; &#8230;]</code> and
    controllability <code>&#120094; = [B, AB, A&#178;B, &#8230;]</code>, so <code>rank H = n</code>.</p>
    <p>SVD: <code>H = U&#931;V<sup>T</sup></code>. Keep n values: <code>&#120106; = U<sub>n</sub>&#931;<sub>n</sub><sup>1/2</sup></code>,
    <code>&#120094; = &#931;<sub>n</sub><sup>1/2</sup>V<sub>n</sub><sup>T</sup></code>. Then C is the first row of &#120106;, B the first column of &#120094;, and
    <code>A = &#931;<sub>n</sub><sup>&#8722;1/2</sup> U<sub>n</sub><sup>T</sup> H<sub>2</sub> V<sub>n</sub> &#931;<sub>n</sub><sup>&#8722;1/2</sup></code>, where H<sub>2</sub> is H shifted by one sample.</p>
    <p>Non-uniqueness: <code>(A, B, C) &#8594; (TAT<sup>&#8722;1</sup>, TB, CT<sup>&#8722;1</sup>)</code> has the same h<sub>k</sub> for every invertible T.</p>
- id: basis
  label: Change of basis
  demo: msd
  lab: basis
  minutes: 8
  top: basis-phase
  row1: basis-time
  row2: basis-matrices
  controls:
  - basis
  aria:
  - The same motion drawn in the physical coordinates and in the realized coordinates
  - The output and the realized states over time
  - The matrices before and after the change of basis, and the poles
  goal: See that a model's states are only a choice of coordinates, and what stays the same when you change them.
  recall: Ho–Kalman returned states that were a mix of position and velocity. Is that a different system, or the same one in other coordinates?
  predict:
    question: You rotate and stretch the state coordinates. What happens to the poles of the model?
    options:
    - They do not change
    - They rotate too
    - They scale with the stretch
    answer: 0
    try: Drag <strong>Rotation</strong> and the stretches, and watch the poles in the bottom plot.
    explain: A′ = T A T⁻¹ is a similar matrix, and similar matrices have the same eigenvalues. The poles belong to the system, not to the coordinates.
  note_title: Same system, different axes
  note: |-
    <p>A <strong>basis</strong> is a set of axes. The motion of the mass does not depend on which axes you draw it in; only the numbers
    that describe it do. The map <code>x&#771; = T x</code> turns physical coordinates (position, velocity) into new ones. The left plot is the
    path of the mass; the right plot is the same path in the new axes, with the images of the old axes drawn as arrows.</p>
    <p>The model follows the same rule: <code>A&#8242; = T A T<sup>&#8722;1</sup></code>, <code>B&#8242; = T B</code>, <code>C&#8242; = C T<sup>&#8722;1</sup></code>.
    The output is <code>y = C&#8242; x&#771; = C T<sup>&#8722;1</sup> T x = C x</code>, so it does not move when you drag T.</p>
    <p><strong>What changes:</strong> every number in A, B and C, and what each state means. <strong>What stays:</strong> the poles, stability,
    the output and the impulse response. So data about inputs and outputs cannot choose T. Ho&#8211;Kalman picks one (a balanced one),
    which is why its states are a mix of position and velocity and not the physical ones. To call a state &#8220;the angle of attack&#8221;
    you need one more piece of information: a physical model, or a calibration against a sensor, as the next lessons do.</p>
  tasks:
  - 'Drag <strong>Rotation</strong>: the right-hand path turns, the position curve does not.'
  - 'Stretch <strong>state 1</strong>: which entries of A′ change, and do the poles?'
  - 'Look at the arrows: where do the position axis and the velocity axis land in the new coordinates?'
  - 'Set rotation 0° and both stretches ×1: A′ becomes A again.'
  check:
  - question: Which of these changes when you change the basis?
    options:
    - The entries of A
    - The poles
    - The output y
    answer: 0
    explain: A′ = T A T⁻¹ has different entries, while its eigenvalues (the poles) and the output y = C x are unchanged.
    why:
    - ''
    - Poles are eigenvalues of similar matrices, so they are the same.
    - The output is C′x̃ = Cx.
  - question: Why can recorded inputs and outputs not say which coordinates are the physical ones?
    options:
    - Every invertible T gives identical input-output behavior
    - The sensor is always noisy
    - The model is too small
    answer: 0
    explain: If (A, B, C) reproduces the data, so does (TAT⁻¹, TB, CT⁻¹) for any invertible T. The data are blind to the choice.
    why:
    - ''
    - 'Noise does not explain it: even perfect data cannot choose T.'
    - Even a full-size model has this freedom.
  recap: say what a change of basis does to A, B and C, and why identified states do not line up with physical ones.
  needs:
  - era
- id: lqr
  label: State feedback
  demo: msd
  lab: sf
  minutes: 8
  top: sim
  row1: states
  row2: analysis
  analysis:
  - contrib
  - bode
  - poles
  controls:
  - reference
  - gains
  - delay
  - noise
  - view
  - margins
  loadLabel: Load LQR gains
  noiseMax: 0.1
  noiseUnit: m
  aria:
  - The mass-spring-damper under state feedback
  - Position and velocity over time
  - What each gain contributes, or the loop analysis
  goal: Feed back both position and velocity, and let LQR choose the gains.
  recall: 'PID reacted to the error and its slope. Here the controller uses the states themselves: position and velocity.'
  predict:
    question: You double the velocity gain k<sub>v</sub>. What does it do to the mass?
    options:
    - Adds damping, so it settles faster
    - Makes it ring more
    - Nothing
    answer: 0
    try: Press <strong>Load LQR gains</strong>, pick Step, then change k<sub>v</sub>.
    explain: The velocity term pushes against the motion, which is damping. More of it removes energy faster.
  note_title: u = K x
  note: '<p>With both states measured, the force is a weighted sum: u&#8201;=&#8201;K&nbsp;x. <strong>LQR</strong> picks K by trading state error (Q) against force (R), by solving a Riccati equation for the plant, so you never tune it by hand. <strong>Load LQR gains</strong> fills in that K. In <strong>Poles</strong> the open-loop pair at &#8722;0.2&#8201;&#177;&#8201;2<em>j</em> moves left: the feedback added damping.</p>'
  tasks:
  - 'Press <strong>Load LQR gains</strong> and pick <strong>Step</strong>: how fast does it settle?'
  - 'Set k<sub>v</sub> to zero: what comes back?'
  - 'Switch <strong>View</strong> to Poles: where are the closed-loop poles, compared with the PID?'
  - 'Add <strong>Sensor noise</strong>: which gain passes it into the force most?'
  check:
  - question: What does LQR trade off when it picks K?
    options:
    - State error against how much force it uses
    - Speed against memory use
    - Position against time
    answer: 0
    explain: Q weights how much each state error costs and R weights the force. A large R gives a gentle controller, a large Q a tight one.
    why:
    - ''
    - LQR is about the plant, not the computer.
    - It trades costs, not units.
  - question: You measure only the position. Can you use k<sub>v</sub>?
    options:
    - 'Not directly: the velocity has to be estimated'
    - Yes, position is enough
    - No, drop k<sub>v</sub>
    answer: 0
    explain: State feedback needs the velocity. With a position sensor you estimate it, which is the next lesson.
    why:
    - ''
    - The controller reads velocity, and a position sensor does not give it.
    - Dropping it throws away the damping.
  recap: use LQR to set state-feedback gains and see them as pole placement.
  needs:
  - stable
- id: estimate
  label: Estimate the speed
  demo: msd
  lab: est
  minutes: 8
  top: sim
  row1: est-states
  row2: contrib
  controls:
  - estimator
  - noise
  - reference
  noiseMax: 0.1
  noiseUnit: m
  aria:
  - The mass under LQR with only a position sensor
  - Measured and true position, and estimated and true velocity
  - What each gain contributes to the force
  goal: Control the mass with only a position sensor, estimating the speed you cannot measure.
  recall: State feedback needed the velocity. Real sensors often give position only.
  predict:
    question: Raise the sensor noise with <strong>Differencing</strong> on. What happens to the force?
    options:
    - It chatters
    - It gets smoother
    - Nothing
    answer: 0
    try: Raise <strong>Sensor noise</strong>, then switch to <strong>Kalman filter</strong>.
    explain: Differencing divides the noise by a small time step, so a tiny position error becomes a large velocity error, and the gain k<sub>v</sub> passes it straight into the force.
  note_title: Predict, then correct
  note: '<p>Differencing estimates speed as (this reading &#8722; last reading) &#247; time step, which amplifies noise. A <strong>Kalman filter</strong> runs a model of the mass alongside it: <strong>predict</strong> with the force just applied, then <strong>correct</strong> toward the position reading. The <strong>trust</strong> slider trades smoothing against lag.</p>'
  tasks:
  - With <strong>Differencing</strong>, raise <strong>Sensor noise</strong> until the force chatters.
  - 'Switch to <strong>Kalman filter</strong> at the same noise: what changes?'
  - 'Slide <strong>Trust</strong> to sensors: the estimate gets noisier. Why?'
  - 'Compare the estimated and true velocity: where does the filter lag?'
  check:
  - question: Why does the Kalman filter beat differencing at high noise?
    options:
    - It uses the model to smooth each reading instead of dividing noise by a time step
    - It measures velocity directly
    - It uses a bigger gain
    answer: 0
    explain: The filter predicts with the model and corrects only part of the way toward each reading, so noise is averaged, not amplified.
    why:
    - ''
    - It still only has the position sensor.
    - The gain is the same; the estimate is better.
  - question: You slide trust all the way to the model. What is the risk?
    options:
    - It lags if the plant does something the model did not expect
    - It becomes noisy
    - It stops working
    answer: 0
    explain: Trusting the model smooths hard but reacts slowly to a real change the model does not know about.
    why:
    - ''
    - That is trusting the sensors.
    - It keeps working, just slowly.
  recap: estimate an unmeasured state with a Kalman filter and say what the trust setting trades.
  needs:
  - lqr
  - arx
- id: sampling
  label: Sampling
  lab: shaken
  top: sim
  row1: samp-time
  row2: samp-fold
  shake: true
  shakeAmp: 1
  controls:
  - freq
  - sampling
  aria:
  - The mass, shaken by a sine-wave force
  - Its position, continuous, sampled, and rebuilt from the samples
  - 'Frequency folding: where a sampled frequency appears'
  note_title: A computer only sees samples
  note: |-
    <p>A controller sees a number every T seconds (the dots) and nothing in between. It is <strong>sampled</strong> in time and
    <strong>quantized</strong> in value (try 2 bits), and its output is held until the next update: a <strong>zero-order hold</strong>.
    Push the signal past <strong>fs/2</strong>, the <strong>Nyquist frequency</strong>, and the dots trace a slower, wrong wave
    (dashed): <strong>aliasing</strong>. Only an analog filter before sampling can remove it.</p>
  demo: msd
  minutes: 8
  goal: See what a computer loses when it only reads a signal every T seconds.
  recall: Is it stable? shook the mass at one frequency at a time. Now only look at it every T seconds.
  predict:
    question: A 3 Hz vibration is sampled at 4 Hz. What does the controller see?
    options:
    - 3 Hz
    - A slower, wrong 1 Hz wave
    - Nothing
    answer: 1
    try: Set the sample rate near 4 Hz and raise &#969; until the dashed alias appears.
    explain: Above half the sample rate the samples are identical to a slower wave's, so nothing afterwards can tell them apart.
  tasks:
  - Raise &#969; past half the <strong>Sample rate</strong> and watch the dashed alias appear.
  - Raise the sample rate until the alias goes away. Where does that happen?
  - Set <strong>Bits</strong> to 2 and watch the dots snap to a grid.
  - 'Look at the fold diagram: where does a frequency above half the rate land?'
  check:
  - question: What is the only cure for aliasing?
    options:
    - Filter the signal before sampling it
    - Filter the samples afterwards
    - Raise the controller gain
    answer: 0
    explain: After sampling the alias looks like a real signal, so only an analog filter before the sampler can remove it.
    why:
    - ''
    - By then it is indistinguishable from a real slower signal.
    - Gain does not change what the samples are.
  recap: say why a signal aliases and what has to happen before sampling to prevent it.
  needs:
  - stable
- id: discretise
  label: Discretize
  lab: disc
  top: disc-z
  row1: disc-step
  row2: disc-bode
  predict:
    question: Convert the mass-spring with forward Euler at T = 0.2 s. What is the discrete model like?
    options:
    - A bit less accurate, but fine
    - Unstable, though the real system is stable
    - Identical to the hold method
    answer: 1
    try: Set T to 0.2 s and pick Fwd.
    explain: Forward Euler maps a pole s to 1 + sT. A lightly damped pole sits close to the imaginary axis, so 1 + sT leaves the unit circle as soon as T is longer than 2ζ/ω<sub>n</sub>, only 0.1 s for this mass-spring. The hold method and Tustin keep a stable pole stable at any T.
  controls:
  - discretize
  aria:
  - The z-plane with the plant's poles as each discretization method places them
  - Step responses of the continuous plant and each discrete model
  - Gain of the continuous plant and each discrete model, up to the Nyquist frequency
  note_title: Four ways to turn ẋ = f(x) into a step-by-step rule
  note: |-
    <p>Discretization turns a continuous model into an update every T seconds. A discrete system is stable when its poles
    are inside the unit circle.</p>
    <ul>
    <li><strong>Zero-order hold</strong>: exact when the input is held between samples. The reference for the others.</li>
    <li><strong>Forward Euler</strong>: at T&#8201;=&#8201;0.2&nbsp;s the poles leave the circle, so a stable plant becomes an unstable model.</li>
    <li><strong>Backward Euler</strong>: always stable, but adds damping that isn't there.</li>
    <li><strong>Tustin</strong>: stable stays stable, at the cost of a squeezed frequency axis. The usual choice for code.</li>
    </ul>
    <p>At small T all four agree: sample fast and the method barely matters.</p>
  demo: msd
  minutes: 8
  goal: Turn a continuous model into an update a computer can run, and see which methods keep it stable.
  recall: A computer cannot integrate; it repeats an update every T seconds.
  check:
  - question: Which method is the usual choice for turning a continuous controller into code?
    options:
    - Tustin
    - Forward Euler
    - 'None: they are all the same'
    answer: 0
    explain: Tustin maps the stable half-plane exactly onto the unit disk, so stable stays stable. Its cost is a squeezed frequency axis.
    why:
    - ''
    - Forward Euler can turn a stable plant into an unstable model.
    - They agree only at small T.
  recap: pick a discretization method and say why forward Euler fails at a large sample time.
  tasks:
  - Slide <strong>T</strong> up to 0.2 s with the <strong>Forward Euler</strong> method. Where do the poles go?
  - 'Pick <strong>Backward Euler</strong>: the poles stay inside, but what is wrong with the step response?'
  - 'Pick <strong>Tustin</strong> and raise T: what happens on the Bode plot?'
  - Pick <strong>All</strong> and shrink T. Do the methods agree?
  needs:
  - sampling
- id: loop
  label: Sample rate
  lab: rate
  top: sim
  row1: time
  row2: disc-loop
  predict:
    question: The PID runs every 20 ms. Slow it to 100 ms. What happens?
    options:
    - Nothing much, 100 ms is still quick
    - It still works, with more overshoot
    - It goes unstable
    answer: 1
    try: Drag "Runs every" to 100 ms and watch the step and the poles.
    explain: Holding each command for one period acts like a delay of about half a period, which costs phase margin. With these gains the loop survives up to about 135 ms, but overshoot grows well before that.
  controls:
  - ctrlrate
  - gains
  - reference
  aria:
  - The mass under PID control, the controller running at the chosen rate
  - Position, reference and the staircase force over time
  - Closed-loop poles of the sampled loop in the z-plane
  note_title: How slow can the controller run?
  note: |-
    <p>The PID now runs at period T with a zero-order hold, and the loop is analyzed exactly in discrete time. These gains are
    stable at 130&nbsp;ms and fall apart at 140&nbsp;ms. The "hold is half a sample of delay" shortcut predicts about 230&nbsp;ms, so treat it
    as an upper bound. In practice run the loop 10&#8211;30 times per crossover period (the panel counts it).</p>
  demo: msd
  minutes: 6
  goal: Find how slowly a PID can run before the loop falls apart.
  recall: You can discretize a model. Now the controller itself runs once every T seconds with a hold between.
  tasks:
  - 'Drag <strong>Runs every</strong> to 100 ms: is it still stable?'
  - 'Go to 140 ms: this is the limit for these gains. Compare the exact limit to the rule of thumb.'
  - Run the loop 10 to 30 times per crossover period. Does the method barely matter?
  check:
  - question: Holding each command for a period acts like how much delay?
    options:
    - About half a period
    - None
    - A full period plus the sensor delay
    answer: 0
    explain: A zero-order hold delays the signal by half a period on average, which costs phase margin at crossover.
    why:
    - ''
    - A hold does cost phase.
    - The sensor delay is not part of the hold.
  recap: set a controller rate from the crossover frequency instead of guessing.
  needs:
  - discretise
  - stable
