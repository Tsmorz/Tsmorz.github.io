  - The real plant running your controller
  - Position, reference and force over time
  - Step response with the current limit, noise and delay
  note_title: Meet the real world
  note: |-
    <p>Add noise, a force limit and delay, and see what breaks first. The D term amplifies noise; a force limit makes the
    integrator wind up and overshoot (the cure is <em>anti-windup</em>); delay eats the margin you proved.</p>
  demo: msd
  minutes: 8
  goal: Run your design on the real plant with a force limit and delay, try some noise, and check every requirement.
  recall: On paper the controller is perfect. On hardware it has noise, limits and delay.
  predict:
    question: You add a force limit to a design that was fine without one. What happens to the overshoot?
    options:
    - It grows, because the integrator winds up while the force is clipped
    - It shrinks
    - Nothing
    answer: 0
    try: Lower <strong>Force limit</strong> and watch the step.
    explain: When the force clips, the error persists and the integrator keeps summing. That extra stored push shows up as overshoot (the cure is anti-windup).
  tasks:
