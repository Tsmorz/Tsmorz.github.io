# /controls/modern/ — safety filters, verifying a network, and two loops at once, on the /controls/ sims.
labs:
  msd_cbf: { plant: msd, controller: pid, cbf: { lim: 1.2, stops: 1.4, lambda: 2 }, refs: [{ amp: 1.8 }] }
  cp_net:  { plant: cartpole, controller: lqr, net: true }
  fl_mimo: { plant: flight, controller: both }
tabs:
  - id: cbf
    label: Safety Filter
    lab: msd_cbf
    top: sim
    row1: time
    row2: cbf
    refAmp: [0.5, 2.5]
    controls: [cbf, reference, gains, restart]
    aria: ["The mass-spring-damper between two hard stops, chasing a reference that goes past them", "Position, reference and force over time", "Phase plane with the safe set, and the requested versus allowed force"]
    note: |-
      <p>The mass now has hard stops at &#177;1.4&nbsp;m and a reference that goes past them. With the <strong>safety filter</strong> on,
      every force first passes through a <strong>control barrier function</strong>: h&#8201;=&#8201;limit&#8201;&#8722;&#8201;|x| may shrink, but only
      slower as it gets small. That leaves a band of allowed forces (teal, right), and the filter sends the nearest one. In the
      phase plane the teal region is the safe set. On the cart-pole the same filter makes the pole fall: a barrier on one state of
      an underactuated plant isn't enough.</p>
  - id: verify
    label: Verifying a Network
    lab: cp_net
    top: sim
    row1: verify-map
    row2: verify-proof
    controls: [controller, noise, verify]
    noiseMax: 2
    noiseUnit: '°'
    aria: ["The cart-pole, balanced by the LQR or the neural network", "The network's force over pole angle and rate, and where its robustness is proved", "The proof against sampled inputs, the split box, and the bound's width by layer"]
    note: |-
      <p>The small network trained to copy the cart-pole's LQR. Verification proves something for <em>every</em> input in a region:
      can a sensor error up to &#949; on the angle move the force by more than &#948;? <strong>Interval bound propagation</strong> pushes the whole
      box through the network. The answer is <strong>proved</strong>, <strong>disproved</strong> (with a counterexample) or <strong>unknown</strong>;
      split the box and bound each piece to tighten it (<strong>branch and bound</strong>). The right map runs the proof at every
      state.</p>
  - id: mimo
    label: Two Loops at Once
    lab: fl_mimo
    top: sim
    sprite: /assets/img/controls/cessna.png
    row1: time
    row2: mimo
    channels: [0, 1]
    window: 20
    mimoRange: [-0.9, 1.5]
    mimoNote: "Here the coloured region fills the box: the elevator and throttle loops barely interact at these gains, so checking each loop alone was enough. That is something to check, not assume: on strongly coupled plants (a spinning satellite is the textbook case) loops that each have huge margins fail together at 10%."
    controls: [mimo, gains]
    aria: ["The aircraft with both loops closed", "Altitude and airspeed errors over time", "Map of which pairs of gain errors keep both loops stable"]
    note: |-
      <p>Real hardware errs in every channel at once. Drag the dot to give each loop a gain error. The <strong>dashed box</strong> is
      what each loop's own margins predict; the <strong>coloured map</strong> is the truth, both errors together. Where they disagree,
      the loops interact.</p>
