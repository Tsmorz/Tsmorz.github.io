# /controls/discrete/ — from continuous to discrete: sampling, converting a model, and running the
# controller at a finite rate. All on the /controls/ mass-spring.
labs:
  shaken: { plant: msd, controller: open, w: 1 }
  model:  { plant: msd, controller: open }
  loop:   { plant: msd, controller: pid, refs: [{ type: step }] }
tabs:
  - id: sampling
    label: Sampling a Signal
    lab: shaken
    top: sim
    row1: samp-time
    row2: samp-fold
    shake: true
    shakeAmp: 1
    controls: [freq, sampling]
    aria: ["The mass, shaken by a sine-wave force", "Its position, continuous, sampled, and rebuilt from the samples", "Frequency folding: where a sampled frequency appears"]
    note_title: A computer only sees samples
    note: |-
      <p>A controller sees a number every T seconds (the dots) and nothing in between. It is <strong>sampled</strong> in time and
      <strong>quantised</strong> in value (try 2 bits), and its output is held until the next update: a <strong>zero-order hold</strong>.
      Push the signal past <strong>fs/2</strong>, the <strong>Nyquist frequency</strong>, and the dots trace a slower, wrong wave
      (dashed red): <strong>aliasing</strong>. Only an analogue filter before sampling can remove it.</p>
  - id: model
    label: Discretising a Model
    lab: model
    top: disc-z
    row1: disc-step
    row2: disc-bode
    predict:
      question: Convert the mass-spring with forward Euler at T = 0.2 s. What is the discrete model like?
      options:
      - A bit less accurate, but fine
      - Unstable, though the real system is stable
      - Identical to the hold method
      answer: 1
      try: Set T to 0.2 s and pick Fwd.
      explain: Forward Euler maps a pole s to 1 + sT. A lightly damped pole sits close to the imaginary axis, so 1 + sT leaves the unit circle as soon as T is longer than 2ζ/ω<sub>n</sub>, only 0.1 s for this mass-spring. The hold method and Tustin keep a stable pole stable at any T.
    controls: [discretize]
    aria: ["The z-plane with the plant's poles as each discretisation method places them", "Step responses of the continuous plant and each discrete model", "Gain of the continuous plant and each discrete model, up to the Nyquist frequency"]
    note_title: Four ways to turn ẋ = f(x) into a step-by-step rule
    note: |-
      <p>Discretisation turns a continuous model into an update every T seconds. A discrete system is stable when its poles
      are inside the unit circle.</p>
      <ul>
      <li><strong>Zero-order hold</strong>: exact when the input is held between samples. The reference for the others.</li>
      <li><strong>Forward Euler</strong>: at T&#8201;=&#8201;0.2&nbsp;s the poles leave the circle, so a stable plant becomes an unstable model.</li>
      <li><strong>Backward Euler</strong>: always stable, but adds damping that isn't there.</li>
      <li><strong>Tustin</strong>: stable stays stable, at the cost of a squeezed frequency axis. The usual choice for code.</li>
      </ul>
      <p>At small T all four agree: sample fast and the method barely matters.</p>
  - id: loop
    label: Sample Rate in the Loop
    lab: loop
    top: sim
    row1: time
    row2: disc-loop
    predict:
      question: The PID runs every 20 ms. Slow it to 100 ms. What happens?
      options:
      - Nothing much, 100 ms is still quick
      - It still works, with more overshoot
      - It goes unstable
      answer: 1
      try: Drag "Runs every" to 100 ms and watch the step and the poles.
      explain: Holding each command for one period acts like a delay of about half a period, which costs phase margin. With these gains the loop survives up to about 135 ms, but overshoot grows well before that.
    controls: [ctrlrate, gains, reference]
    aria: ["The mass under PID control, the controller running at the chosen rate", "Position, reference and the staircase force over time", "Closed-loop poles of the sampled loop in the z-plane"]
    note_title: How slow can the controller run?
    note: |-
      <p>The PID now runs at period T with a zero-order hold, and the loop is analysed exactly in discrete time. These gains are
      stable at 130&nbsp;ms and fall apart at 140&nbsp;ms. The "hold is half a sample of delay" shortcut predicts about 230&nbsp;ms, so treat it
      as an upper bound. In practice run the loop 10&#8211;30 times per crossover period (the panel counts it).</p>
