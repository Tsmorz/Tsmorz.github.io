# /controls/estimation/ — state estimation on the /controls/ cart-pole: differencing, a Kalman
# filter, and what estimation does to LQR's guaranteed margins (LQG).
labs:
  diff: { plant: cartpole, controller: lqg, estimator: diff, noise: 0.5 }
  kf:   { plant: cartpole, controller: lqg, estimator: kalman, noise: 0.5, logQ: 0 }
tabs:
  - id: problem
    label: The Problem
    lab: diff
    top: sim
    row1: est-states
    row2: contrib
    noiseMax: 2
    noiseUnit: '°'
    fixedEstimator: "Rates by differencing: (this reading − last reading) ÷ 25 ms."
    trust: false
    controls: [estimator, noise, reference]
    aria: ["The cart-pole balanced by LQR using rates computed by differencing noisy readings", "Measured and true pole angle, and estimated and true rates", "Each gain's contribution to the force"]
    note_title: You can't control what you can't measure
    note: |-
      <p>LQR needs four states but only the cart position and pole angle are measured. <strong>Differencing</strong> estimates a rate
      by subtracting readings 25&nbsp;ms apart, which turns half a degree of noise into a 20&nbsp;&#176;/s error. Raise the noise: the force
      chatters, and at about 2&#176; the pole falls. The controller is fine; it is being fed bad numbers.</p>
  - id: kalman
    label: Kalman Filter
    lab: kf
    top: sim
    row1: est-states
    row2: contrib
    noiseMax: 2
    noiseUnit: '°'
    predict:
      question: Slide the trust all the way to "sensors". What happens to the rate estimate?
      options:
      - It gets smoother
      - It gets noisier, close to plain differencing
      - Nothing changes
      answer: 1
      try: Drag the trust slider to the right and watch the estimated rate against the true one.
      explain: 'Trusting the sensors means a large Kalman gain: each new reading pulls the estimate hard, so its noise comes straight through. Trusting the model smooths, but reacts late when the model is wrong.'
    controls: [estimator, noise, reference]
    aria: ["The cart-pole balanced by LQR on Kalman-filtered estimates", "Measured and true pole angle, and estimated and true rates", "Each gain's contribution to the force"]
    note_title: Predict, then correct
    note: |-
      <p>A <strong>Kalman filter</strong> runs a model of the plant alongside it. <strong>Predict:</strong> push the estimate forward with
      the force just applied. <strong>Correct:</strong> nudge all four estimates toward the sensor readings. Switch between
      <strong>Differencing</strong> and <strong>Kalman filter</strong> at 2&#176; of noise: one drops the pole, the other never does. The
      <strong>trust</strong> slider trades smoothing (model) against lag (sensors).</p>
  - id: lqg
    label: LQG and Margins
    lab: kf
    top: analysis
    analysis: [poles, nyquist, bode]
    row1: sim
    row2: est-states
    compareLqr: true
    noiseMax: 2
    noiseUnit: '°'
    controls: [estimator, view, noise, margins]
    aria: ["Poles, Nyquist or Bode plot of the loop with the estimator in it", "The cart-pole with LQR on Kalman estimates", "Estimated and true rates"]
    note_title: Estimation costs robustness — the LQG lesson
    note: |-
      <p>LQR plus a Kalman filter is <strong>LQG</strong>. By the <strong>separation principle</strong> you design them separately: in
      <strong>Poles</strong>, the four ringed poles are the filter's and only they move with trust. But the LQR margin guarantees are gone
      (Doyle, 1978: "There are none."). Trusting the model leaves about 20&#176; of phase margin; trusting the sensors recovers
      most of it and lets noise back in.</p>
