# /controls/sysid/ — system identification: least squares (ARX) and Ho–Kalman (ERA), each on the
# /controls/ mass-spring. All tabs share one lab, so both fits use the same plant.
labs:
  id: { plant: msd, controller: pid, params: { M: 1, k: 4, c: 0.4 }, sysid: { exc: prbs, noise: 0.01, T: 30, order: 2, amp: 2 } }
tabs:
  - id: arx
    label: Least Squares (ARX)
    lab: id
    top: sysid-replay
    row1: sysid-data
    row2: sysid-bode
    controls: [sysid]
    aria: ["The mass replaying the identification experiment", "The input, the noisy measurement, and the fitted model's prediction", "Bode plot of the true plant and the fitted model"]
    note_title: Fit a difference equation by least squares
    note: |
      <p>Record input and output, then find the difference equation that best predicts each output sample from the
      ones before it. That is linear in the unknowns, so one least-squares solve finds them. It is biased by sensor
      noise, so the fit is refined with <strong>instrumental variables</strong>. A 2nd-order fit reads back as m, c
      and k; a 3rd or 4th keeps its slowest oscillating pair (marked <strong>*</strong>); a 1st cannot oscillate, so there
      is nothing to read. A step barely excites the resonance, so try a chirp or random input.</p>
  - id: era
    label: Ho–Kalman (ERA)
    lab: id
    method: era
    top: id-replay
    row1: id-era
    row2: id-result
    controls: [idrun]
    aria: ["The mass replaying a hammer tap", "The Hankel matrix of the impulse response, its singular values, and the measured and realized impulse responses", "Estimated mass, damping and spring against the true values"]
    note_title: Realize a state-space model from the impulse response
    note: |
      <p>Tap the mass and record how it rings. Stacked into a <strong>Hankel matrix</strong>, that impulse response has a
      rank equal to the number of states, and the <strong>singular values</strong> show it: two are large, the rest are
      noise. Keep the large ones and the model follows (the dashed curve). Turn the noise up and the gap shrinks, so
      choosing where to cut becomes a judgement. Keeping 1 reads nothing; 3 or 4 read from the slowest oscillating
      pair.</p>
  - id: yours
    label: Your Own Data
    lab: id
    top: sim
    row1: rec-data
    row2: rec-fit
    startManual: true
    manualHint: "<strong>Manual:</strong> drag the mass to push it yourself. Or switch to PID and let the controller move it."
    controls: [mode, record]
    aria: ["The live mass-spring-damper: drag it, tap it, or let the PID drive it while recording", "Your recorded force and position", "Models identified from your recording, checked on the part held back"]
    note_title: Collect your own data
    note: |
      <p>Press <strong>Record</strong> and move the mass any way you like: drag it, tap it, switch on the shaker, or let
      the PID chase its reference. Then <strong>Identify</strong>: both methods fit the first 70% and are checked on the
      last 30%. Gentle pushes barely excite the resonance, and data recorded under PID control is closed-loop, which
      biases the fit unless the shaker also excites it.</p>
