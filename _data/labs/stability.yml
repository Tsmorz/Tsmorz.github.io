# /controls/stability/ — frequency response, Nyquist and poles on the /controls/ sims.
# Rendered by _includes/lab.html; views and controls are listed at the top of assets/js/lab/lab.js.
labs:
  msd_open: { plant: msd, controller: open, w: 0.5 }
  msd_pid:  { plant: msd, controller: pid }
  cp_lqr:   { plant: cartpole, controller: lqr }
  fl:       { plant: flight, controller: both }
tabs:
  - id: plant
    label: The Plant
    lab: msd_open
    top: sim
    row1: time
    row2: analysis
    analysis: [bode, poles]
    shake: true
    shakeAmp: 1
    controls: [freq, view]
    aria: ["The mass on its spring, shaken by a sine-wave force", "Force in and position out over time", "Bode plot or poles of the mass-spring-damper"]
    note: |-
      <p>The mass on a spring, with no controller, shaken by a 1&nbsp;N sine. A Bode plot shows how big the output is, and how late,
      at each frequency. Drag &#969; or press <strong>Sweep</strong>: it resonates near 2&nbsp;rad/s. In <strong>Poles</strong>, the
      &#215; marks are the system's own motions. <strong>Drag a pole</strong> to change the spring and damper.</p>
  - id: pid
    label: PID Loop
    lab: msd_pid
    top: sim
    row1: time
    row2: analysis
    analysis: [bode, nyquist, poles]
    predict:
      question: Add 100 ms of delay. What happens to the Bode plot?
      options:
      - The gain curve drops everywhere
      - The gain curve stays put and the phase curve falls away at high frequency
      - Both curves shift to lower frequencies
      answer: 1
      try: Pick the Bode view, then drag the delay slider from 0 to 100 ms.
      explain: 'A delay changes when the signal arrives, not how big it is: e<sup>−sT</sup> has gain 1 and phase −ωT. The phase loss grows with frequency, so the phase margin shrinks by ω<sub>c</sub>T at crossover.'
    controls: [reference, gains, delay, noise, view, freq, margins]
    aria: ["The mass-spring-damper under PID control", "Position, reference and force over time", "Loop analysis: Bode, Nyquist or poles"]
    note: |-
      <p>The PID loop from the Intro demo, cut open at the force. The <strong>loop gain</strong> L(s)&#8201;=&#8201;C(s)G(s) is one trip
      round the loop; if it comes back inverted at the same size (0&nbsp;dB, &#8722;180&#176;) the loop oscillates by itself.
      <strong>Phase</strong>, <strong>gain</strong> and <strong>delay margin</strong> say how far you are. Push the delay past its margin and watch the sim
      agree. In <strong>Poles</strong>, drag a closed-loop pole and the gains are solved to put it there.</p>
  - id: lqr
    label: LQR Loop
    lab: cp_lqr
    top: sim
    row1: time
    row2: analysis
    analysis: [bode, nyquist, poles]
    predict:
      question: Halve all four LQR gains. Does the pole stay up?
      options:
      - Yes, with a smaller phase margin
      - No, the loop goes unstable
      - Yes, and the margins get bigger
      answer: 0
      try: Set each gain to about half its suggested value and watch the Nyquist plot and the margins.
      explain: An LQR loop has at least 60° of phase margin and can lose half its gain, at the plant input, with every state measured. Halving all four gains is exactly that test, so it stays up, with less margin to spare.
    controls: [reference, gains, delay, noise, view, freq, margins]
    noiseMax: 2
    noiseUnit: '°'
    aria: ["The cart-pole under LQR state feedback", "Cart position, reference and force over time", "Loop analysis: Bode, Nyquist or poles"]
    note: |-
      <p>The cart-pole with its LQR gains, cut open at the force. With every state measured, LQR guarantees at least 60&#176; of
      phase margin and a gain that can halve. The plant is unstable, so gain can also be too <em>low</em>: use
      <strong>Nyquist</strong>, where the curve must circle &#8722;1 once counterclockwise.</p>
  - id: flight
    label: Aircraft
    lab: fl
    top: sim
    sprite: /assets/img/controls/cessna.png
    row1: time
    row2: analysis
    analysis: [bode, nyquist, poles]
    channels: [0, 1]
    window: 20
    controls: [channel, view, freq, gains, delay, margins]
    aria: ["The aircraft holding altitude with elevator and airspeed with throttle", "Altitude and airspeed errors over time", "Loop analysis of the chosen loop"]
    note: |-
      <p>The flight sim with both loops on: altitude by elevator, airspeed by throttle. <strong>Which loop to cut</strong> picks one
      and leaves the other closed, as margins are measured in practice.</p>
