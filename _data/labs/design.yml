# /controls/design/ — one plant through the whole design process, six steps sharing one lab.
labs:
  d:
    plant: msd
    controller: pid
    params: { M: 1.6, c: 0.9, k: 6.5 }      # the "real" plant: not what the textbook says
    model:  { M: 1.0, c: 0.4, k: 4.0 }      # the textbook model you start from
    gains: [{ kp: 10, ki: 2, kd: 2 }]
    limit: 60
    requirements: { overshoot: 10, settle: 3, pm: 45, delay: 50, force: 30 }
    sysid: { exc: chirp, noise: 0.01, T: 30, order: 2, amp: 2 }
    refs: [{ type: step }]
tabs:
  - id: requirements
    label: 1 · Requirements
    lab: d
    top: step
    row1: poles
    row2: checklist
    controls: [requirements]
    aria: ["Step response on the real plant against the overshoot and settling limits", "Where closed-loop poles must sit to meet the requirements", "The requirements checklist"]
    note_title: Step 1 — Say what good means
    note: |
      <p>Before any design, write down what the controller must achieve, as numbers. Here: how far it may
      overshoot a step, how fast it must settle, how much phase and delay margin it must keep (robustness), and how
      much force it may use (the actuator). Each requirement becomes a picture: overshoot and settling become an
      envelope the step response must stay inside (top), and they also become a region of the s-plane where the
      closed-loop poles must sit (middle): a cone for damping, a line for speed. Move the sliders and watch both
      move. The checklist (bottom) is the contract you'll be held to in step 6.</p>
  - id: model
    label: 2 · Model
    lab: d
    top: sysid-replay
    row1: sysid-data
    row2: sysid-bode
    controls: [sysid]
    useModel: true
    aria: ["The real plant replaying the identification experiment", "The recorded data and the fitted model", "Bode plot of the real plant and the fitted model"]
    note_title: Step 2 — Find out what you're controlling
    note: |
      <p>The textbook says this is a 1&nbsp;kg mass on a spring of 4 with damping 0.4. It isn't: someone bolted on
      a bracket and swapped the spring. You only find out by measuring. Run the experiment and look at the fitted
      mass, damper and spring, then press <strong>Design with this model</strong>. Every later step uses the model
      you pick here, and the test in step 6 runs on the real thing, so a bad model shows up there. (See the
      <a href="/controls/sysid/">System ID page</a> for what makes a good experiment.)</p>
  - id: design
    label: 3 · Design
    lab: d
    top: step
    row1: poles
    row2: bode
    controls: [gains, margins]
    aria: ["Step response on the real plant", "Closed-loop poles on your model: drag them into the shaded region", "Bode plot of the loop on your model"]
    note_title: Step 3 — Design the controller
    note: |
      <p>Now choose the controller. With a PID on a mass-spring there are three gains and three closed-loop poles,
      so you can simply <strong>drag the poles into the shaded region</strong> from step 1 and the gains are solved
      for you (pole placement). Faster poles (further left) settle sooner but need more force; poles closer to the
      real axis overshoot less. The step response on top is on the <em>real</em> plant, so if you skipped step 2
      it won't match what the poles promise.</p>
  - id: verify
    label: 4 · Verify
    lab: d
    top: analysis
    row1: step
    row2: checklist
    analysis: [nyquist, bode, poles]
    controls: [view, delay, margins]
    aria: ["Nyquist, Bode or poles of the loop on your model", "Step response on the real plant", "The requirements checklist"]
    note_title: Step 4 — Prove it's stable, with room to spare
    note: |
      <p>A step response that looks fine says nothing about the cases you didn't try. Stability is proved on the
      model: the <strong>Nyquist</strong> curve must not circle &#8722;1, and the <strong>margins</strong> say how
      much the gain or the delay could change before it would. Those margins are your budget for everything the
      model gets wrong. Add delay to see how much of it a slow sensor or a slow control loop would spend. (The
      <a href="/controls/stability/">Stability page</a> explains each view.)</p>
  - id: implement
    label: 5 · Implement
    lab: d
    top: sim
    row1: time
    row2: step
    controls: [limit, noise, delay, reference]
    noiseMax: 0.02
    aria: ["The real plant running your controller", "Position, reference and force over time", "Step response with the current limit, noise and delay"]
    note_title: Step 5 — Meet the real world
    note: |
      <p>On paper the controller is continuous and perfect. On hardware it runs at a fixed rate, reads noisy
      sensors, and drives an actuator with a limit. Add each of these and watch what breaks first. Noise gets
      amplified by the D term (the force trace gets ragged). A force limit clips the big early push, and the
      integrator keeps winding up meanwhile, which adds overshoot (the cure is <em>anti-windup</em>). Delay eats
      the phase margin you proved in step 4. A design with margin survives all three.</p>
  - id: test
    label: 6 · Test
    lab: d
    top: sim
    row1: step
    row2: checklist
    controls: [restart]
    aria: ["The real plant running your controller", "Step response on the real plant", "The requirements checklist, all green when the design is done"]
    note_title: Step 6 — Test against the requirements
    note: |
      <p>Finally, hold the design to the contract from step 1, on the real plant with everything from step 5
      switched on. Every line green means done; any red means going back: to step 3 for a different trade-off,
      to step 2 if the model was wrong, or to step 1 if the requirements can't all be met with this actuator.
      Real projects add one more check here, on hardware, before anything ships. Most designs loop through these
      steps several times.</p>
