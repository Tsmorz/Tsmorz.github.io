# /controls/design/ — one plant through the whole design process, six steps sharing one lab.
labs:
  d:
    plant: msd
    controller: pid
    params: { M: 1.6, c: 0.9, k: 6.5 }      # the "real" plant: not what the textbook says
    model:  { M: 1.0, c: 0.4, k: 4.0 }      # the textbook model you start from
    gains: [{ kp: 10, ki: 2, kd: 2 }]
    limit: 60
    requirements: { overshoot: 10, settle: 3, pm: 45, delay: 50, force: 30 }
    sysid: { exc: chirp, noise: 0.01, T: 30, order: 2, amp: 2 }
    refs: [{ type: step }]
tabs:
  - id: requirements
    label: 1 · Requirements
    lab: d
    top: step
    row1: poles
    row2: checklist
    controls: [requirements]
    aria: ["Step response on the real plant against the overshoot and settling limits", "Where closed-loop poles must sit to meet the requirements", "The requirements checklist"]
    note_title: Step 1 — Say what good means
    note: |-
      <p>Write down what the controller must achieve, as numbers: overshoot, settling time, margins, force. Each becomes a
      picture: an envelope the step response must stay inside, and a region of the s-plane for the poles. The checklist is the
      contract for step 6.</p>
  - id: model
    label: 2 · Model
    lab: d
    top: sysid-replay
    row1: sysid-data
    row2: sysid-bode
    controls: [sysid]
    useModel: true
    aria: ["The real plant replaying the identification experiment", "The recorded data and the fitted model", "Bode plot of the real plant and the fitted model"]
    note_title: Step 2 — Find out what you're controlling
    note: |-
      <p>The textbook says 1&nbsp;kg, spring 4, damping 0.4. The real plant differs, and you only find out by measuring. Run the
      experiment, then press <strong>Design with this model</strong>. Later steps use this model; step 6 runs on the real thing. (See the
      <a href="/controls/sysid/">System ID page</a>.)</p>
  - id: design
    label: 3 · Design
    lab: d
    top: step
    row1: poles
    row2: bode
    controls: [gains, margins]
    aria: ["Step response on the real plant", "Closed-loop poles on your model: drag them into the shaded region", "Bode plot of the loop on your model"]
    note_title: Step 3 — Design the controller
    note: |-
      <p>Three gains, three closed-loop poles: <strong>drag the poles into the shaded region</strong> from step 1 and the gains are
      solved (pole placement). Faster poles settle sooner but need more force. The step response is on the <em>real</em> plant.</p>
  - id: verify
    label: 4 · Verify
    lab: d
    top: analysis
    row1: step
    row2: checklist
    analysis: [nyquist, bode, poles]
    controls: [view, delay, margins]
    aria: ["Nyquist, Bode or poles of the loop on your model", "Step response on the real plant", "The requirements checklist"]
    note_title: Step 4 — Prove it's stable, with room to spare
    note: |-
      <p>A good-looking step response says nothing about cases you didn't try. The <strong>Nyquist</strong> curve must not circle
      &#8722;1, and the <strong>margins</strong> are your budget for everything the model gets wrong. Add delay to spend some of it. (The
      <a href="/controls/stability/">Stability page</a> explains each view.)</p>
  - id: implement
    label: 5 · Implement
    lab: d
    top: sim
    row1: time
    row2: step
    controls: [limit, noise, delay, reference]
    noiseMax: 0.02
    aria: ["The real plant running your controller", "Position, reference and force over time", "Step response with the current limit, noise and delay"]
    note_title: Step 5 — Meet the real world
    note: |-
      <p>Add noise, a force limit and delay, and see what breaks first. The D term amplifies noise; a force limit makes the
      integrator wind up and overshoot (the cure is <em>anti-windup</em>); delay eats the margin from step 4.</p>
  - id: test
    label: 6 · Test
    lab: d
    top: sim
    row1: step
    row2: checklist
    controls: [restart]
    aria: ["The real plant running your controller", "Step response on the real plant", "The requirements checklist, all green when the design is done"]
    note_title: Step 6 — Test against the requirements
    note: |-
      <p>Hold the design to step 1 on the real plant with everything from step 5 on. All green means done; red means going back to
      step 3, 2 or 1. Most designs loop through these steps several times.</p>
