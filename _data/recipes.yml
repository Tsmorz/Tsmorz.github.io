# Recipes shown on /recipes/ and in the Recipes nav dropdown. Every amount is a weight, so the whole thing
# runs on a kitchen scale; assets/js/recipes.js converts to ounces and °F when the visitor picks imperial.
#
#   id            slug used in the URL hash (#hummingbird-cake)
#   name, blurb   required
#   makes, time   optional one-liners
#   ingredients   groups of items, in the order they are used. A group's `group` name is optional.
#     item:       name + either `g` (grams) or `qty` (text, for things that can't be weighed)
#                 id (needed only to point at it from a step), note, spoon (a volume equivalent for tiny amounts)
#   steps         one string each. [[...]] tokens are converted to the visitor's units:
#                 [[i:sugar]] the amount of that ingredient   [[g:700]] grams   [[t:175]] or [[t:22-26]] °C
#                 [[len:20]] cm   [[ml:175]] millilitres
#                 Those stay put when the visitor scales the recipe (they are per piece: a ball, a ramekin, the oven).
#                 These scale with it: [[i:id]]   [[n:4]] a count   [[gx:340]] grams   [[mlx:4000]] millilitres
#                 `spoon` scales too, so start it with a number ("1¼ tsp").
# script/test-data checks the shape; script/test-recipes checks the conversions and renders every recipe.

- id: kombucha
  name: Kombucha
  blurb: Sweet tea turned tart and fizzy by a SCOBY. One jar, first fermentation.
  makes: About [[mlx:4000]], in a [[mlx:6000]] jar
  time: 7 to 10 days, 30 minutes of work
  ingredients:
    - items:
        - { id: water-hot, name: Water, note: "for the tea", g: 1000 }
        - { id: sugar, name: Sugar, g: 330 }
        - { id: tea, name: Black or green tea, note: "[[n:8]] tea bags, or loose leaf", g: 16, spoon: 2 tbsp }
        - { id: water-cold, name: Cold filtered water, g: 3000 }
        - { id: starter, name: Unflavored kombucha, note: "from your last batch or a bottle of raw kombucha", g: 400 }
        - { name: SCOBY, qty: "1" }
  steps:
    - "Wash a [[mlx:6000]] glass jar and your hands with hot water. Skip the soap; its film can harm the culture."
    - "Put the pot on the scale, tare, and weigh in the hot water. Bring it to a boil."
    - "Off the heat, stir in the sugar until it dissolves, then add the tea."
    - "Steep for 10 minutes, then strain the tea out."
    - "Pour into the jar and add the cold water. Wait until it is below [[t:30]] before the next step, or the heat will kill the culture."
    - "Add the starter kombucha, then slide in the SCOBY."
    - "Cover with a clean cloth and a rubber band. Keep at [[t:22-26]], out of direct sun, for 7 to 10 days."
    - "From day 7, taste a spoonful each day. Stop when it is as sweet and tart as you like; longer means more sour."
    - "Set aside [[i:starter]] of the finished kombucha with the SCOBY as the starter for your next batch. Bottle the rest and chill at [[t:4]]."
  notes:
    - "Brown strings and bubbles under the SCOBY are yeast, and normal. Fuzzy, dry mold that is blue, green or black on top means throw it all out."

- id: hummingbird-cake
  name: Hummingbird cake
  blurb: Carrot, pineapple, coconut and almonds, lightened with whipped egg whites and finished with cream cheese icing.
  makes: One half sheet pan, a two-layer cake, or cupcakes
  time: About 1 hour, plus cooling
  ingredients:
    - group: Cake
      items:
        - { name: Carrots, note: "grated fine", g: 454 }
        - { name: Brown sugar, g: 528 }
        - { name: Salt, g: 5, spoon: "1 tsp" }
        - { name: Ground cinnamon, g: 1, spoon: "½ tsp" }
        - { name: Egg yolks, note: "about [[n:16]] large", g: 295 }
        - { name: Neutral oil, g: 227 }
        - { name: Pineapple juice, g: 181 }
        - { name: Coconut, note: "chopped fine", g: 80 }
        - { name: Pineapple, note: "chopped medium", g: 227 }
        - { name: Almonds, note: "chopped fine", g: 227 }
        - { name: Cake flour, g: 558 }
        - { name: Baking soda, g: 5, spoon: "1 tsp" }
    - group: Meringue
      items:
        - { name: Egg whites, note: "about [[n:14]] large", g: 454 }
        - { name: Powdered egg whites, g: 23 }
        - { name: White sugar, g: 454 }
        - { name: Cream of tartar, g: 4, spoon: "1¼ tsp" }
    - group: Cream cheese icing
      items:
        - { name: Cream cheese, note: "soft, from the block", g: 454 }
        - { name: Butter, note: "soft", g: 227 }
        - { name: Fondant sugar, note: "Drivert, or powdered sugar", g: 544 }
        - { name: Orange, lemon or pineapple juice, note: "optional, to thin", g: 30, spoon: "2 tbsp" }
  steps:
    - "Heat the oven to [[t:175]]. Line a half sheet pan ([[len:33]] × [[len:46]]) with parchment and fit a pan extender around it."
    - "In a stand mixer with the paddle, mix the carrots, brown sugar, salt and cinnamon for 5 minutes on medium-high."
    - "Add the egg yolks in 3 additions, mixing well after each."
    - "Add the oil and mix well."
    - "Add the pineapple juice, coconut, pineapple and almonds, and mix for 2 to 3 minutes."
    - "Sift the cake flour and baking soda together, add them to the batter and mix quickly."
    - "In a large, grease-free bowl with the whisk, whip the egg whites, powdered egg whites and cream of tartar to a thick froth. Add the white sugar in a slow, steady stream and whip to thick, moist peaks."
    - "Fold a small scoop of the whites into the batter to loosen it, then add the rest and fold in gently."
    - "Pour into the pan and smooth the top. For cupcakes, fill lined cups ¾ full instead."
    - "Bake 20 to 25 minutes. Do not overbake."
    - "While the cake bakes, whip the cream cheese, butter and fondant sugar until smooth. Leave out the juice, and stop once it is smooth: over-whipping thins the icing."
    - "For a thin icing, stir in juice until it is a very thick pouring consistency, pour it over the warm cake and spread quickly. For a thick icing, skip the juice and spread it with a spatula at any time."
    - "Let the cake cool completely, then cut it into pieces. For a two-layer cake, cut the sheet in half across, spread [[g:420]] of thick icing on one half, stack the other on top and cover with the rest."
  notes:
    - "For a richer icing, melt [[gx:340]] of white chocolate and mix it into the butter before the butter goes in with the cream cheese."
    - "The meringue whips up big. Use the largest bowl your mixer has."

- id: creme-brulee
  name: Crème brûlée
  blurb: Vanilla and Grand Marnier custard baked in a water bath, under a glass-thin caramel top.
  makes: "[[n:8]] ramekins of [[ml:120-175]]"
  time: 1 hour of work, plus a few hours to chill
  ingredients:
    - group: Custard
      items:
        - { name: Sugar, g: 67 }
        - { name: Heavy cream, g: 715 }
        - { name: Egg yolks, note: "about [[n:4]] extra-large", g: 80 }
        - { name: Whole egg, note: "about [[n:1]] extra-large", g: 56 }
        - { name: Vanilla extract, g: 6, spoon: "1½ tsp" }
        - { name: Grand Marnier, g: 15, spoon: "1 tbsp" }
    - group: Water bath
      items:
        - { name: Water, note: "boiling", g: 950 }
    - group: To finish
      items:
        - { name: Superfine sugar, note: "for the tops, [[g:4]] per ramekin", g: 32 }
        - { name: Fresh berries, qty: to garnish }
        - { name: Fresh mint leaves, qty: to garnish }
  steps:
    - "Heat the oven to [[t:150]]. Set [[n:8]] ramekins in a baking pan and bring the water to a boil."
    - "Weigh the cream and sugar into a saucepan. Warm over medium-low heat until the cream simmers and the sugar dissolves."
    - "While the cream heats, weigh the yolks and whole egg into a large jug and whisk them with an immersion blender. Add the vanilla and Grand Marnier and whisk to combine."
    - "Slowly pour the hot cream into the eggs, whisking all the time."
    - "Strain through a fine sieve and weigh [[g:117]] of custard into each ramekin."
    - "Put the pan in the oven and slowly pour the boiling water in until it comes up to the level of the custard. Bake 30 to 40 minutes, until the custard is set but still jiggles in the center when gently shaken."
    - "Take the pan out and lift the ramekins from the bath with tongs. Cool to room temperature, then refrigerate until firm."
    - "Just before serving, sprinkle [[g:4]] of sugar (¾ to 1 tsp) evenly over each custard and torch until it is evenly caramelized."
    - "Let them sit a few minutes, until the sugar hardens and the ramekins are cool to the touch. Garnish with berries and mint."
  notes:
    - "You need an immersion blender and a kitchen torch."
    - "Superfine sugar melts evenly under the torch; coarse crystals burn before they melt."

- id: pizza-dough
  name: Pizza dough
  blurb: A wet, slow-rising dough that bakes up blistered and chewy.
  makes: "[[n:4]] pizzas of [[len:30]]"
  time: 30 minutes of work, plus 1 to 2 days in the fridge
  ingredients:
    - items:
        - { id: water, name: Water, note: "cool, about [[t:20]]", g: 397 }
        - { name: Sourdough starter, note: "active and bubbly, or [[gx:8]] instant yeast", g: 128 }
        - { name: 00 flour, note: "or bread flour", g: 640 }
        - { name: Fine salt, g: 19, spoon: "3¼ tsp" }
        - { name: Olive oil, g: 8, spoon: "2 tsp" }
  steps:
    - "Weigh the water into a large bowl, add the starter (or yeast) and stir to dissolve."
    - "Weigh the flour and salt on top. Mix with your hand until no dry flour is left, then rest 20 minutes."
    - "Add the olive oil and knead on the counter for 8 to 10 minutes, until smooth and springy but still a little tacky. Add water, not flour, if it fights you."
    - "Cover the bowl and leave it at [[t:20-24]] for 1 hour."
    - "Put the bowl on the scale and cut the dough into [[n:4]] balls of about [[g:298]] each. Roll each one tight and set it in a lightly oiled container with a lid."
    - "Refrigerate at [[t:4]] for 24 to 48 hours."
    - "Take the balls out 2 hours before baking so they come up to room temperature."
    - "Put a pizza stone or steel on the top rack and heat the oven to its highest setting, ideally [[t:260]] or more, for 45 minutes."
    - "On a well-floured surface, press each ball out from the center and stretch it by hand to about [[len:30]]. Leave a thicker rim, and skip the rolling pin so the bubbles stay in."
    - "Top lightly and slide onto the stone. Bake 6 to 8 minutes, until the rim is puffed, blistered and browned."
  notes:
    - "To freeze, wrap the balls after shaping. Thaw them overnight in the fridge, then give them their 2 hours at room temperature."
    - "Heavy toppings make a soggy middle. Less sauce and cheese than you think."
