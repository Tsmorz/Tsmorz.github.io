# Robot tasks and guidance. Metres and seconds.
title: Robot tasks
subtitle: Pick a task. Practise a grasp. Build up to two grippers.
levels:
- id: bowl
  name: Ball in the bowl
  hands: 1
  skill: First grasp
  brief: Pick up the blue ball and release it inside the wide bowl. Take your time.
  hint: Close around the ball, lift, move over the opening, then release. A settled ball counts.
  par: 90
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: '#2a78d6'
  - key: bowl
    kind: bowl
    at:
    - 0.04
    - -0.17
    - 0
    label: Bowl
    color: '#168a73'
    mass: 0.22
  goals:
  - type: inside
    object: ball
    target: bowl
    label: Release the ball in the bowl
    destination: the bowl
  guided:
    keep:
    - ball
    - bowl
    goal_count: 1
    par: 90
    placements:
      bowl:
      - 0
      - 0.03
      - 0
    name: Ball in the bowl
    brief: Pick up the ball, move it over the bowl, and open the gripper. Let the ball settle inside.
  guide:
    plan:
    - Open either gripper and centre the ball between its two pads.
    - Close until the ball stays between the pads. Lift it clear of the table.
    - Move over the bowl, lower just above the opening, then open the gripper.
    tips:
    - Close around the ball, lift, move over the opening, then release. A settled ball counts.
    - If the jaws close without gripping, open them and centre the prop between both pads before trying
      again.
- id: precision
  name: A smaller target
  hands: 1
  skill: Precision
  brief: Put the ball inside the mug. The opening is only a little wider than the ball.
  hint: Look down through the head camera to line up the opening. Motion × 0.5 helps with tags.
  par: 120
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: '#2a78d6'
  - key: cup
    kind: cup
    at:
    - 0.03
    - -0.18
    - 0
    label: Mug
    color: '#2a78d6'
  goals:
  - type: inside
    object: ball
    target: cup
    label: Release the ball in the mug
    destination: the mug
  guided:
    keep:
    - cup
    goal_count: 1
    par: 90
    placements:
      cup:
      - -0.1
      - 0.17
      - 0
    goals:
    - type: place
      object: cup
      label: Cup upright on the coaster
      at:
      - 0.015
      - -0.05
      - 0
      tolerance:
      - 0.03
      - 0.03
      - 0.012
      upright: true
      destination: the coaster
    markers:
    - at:
      - 0.015
      - -0.05
      - 0.001
      size:
      - 0.1
      - 0.1
      label: Coaster
    name: Cup on the coaster
    brief: Pick up the cup and set it upright on its coaster. Release it before checking its position.
  guide:
    plan:
    - Grip the sides of the cup, not its handle.
    - Lift the cup, keep it upright, and move above the coaster.
    - Lower it onto the table and open the gripper.
    tips:
    - Look down through the head camera to line up the opening. Motion × 0.5 helps with tags.
    - If the jaws close without gripping, open them and centre the prop between both pads before trying
      again.
    full_plan:
    - Pick up the ball with either gripper.
    - Lift it above the mug and line it up with the opening.
    - Lower the ball just above the rim and open the gripper.
    full_tips:
    - Look down through the head camera to line up the opening. Motion × 0.5 helps with tags.
- id: sort
  name: Sort the delivery
  hands: 1
  skill: Placement
  brief: Move each labelled block to its matching outline. All three must stay there together.
  hint: Lift clear of the other blocks. Letters identify the targets as well as colour.
  par: 150
  objects:
  - key: a
    kind: block
    at:
    - -0.12
    - 0.25
    - 0.025
    label: A
    color: '#2a78d6'
    mass: 0.09
  - key: b
    kind: block
    at:
    - -0.12
    - 0
    - 0.025
    label: B
    color: '#168a73'
    mass: 0.09
  - key: c
    kind: block
    at:
    - -0.12
    - -0.25
    - 0.025
    label: C
    color: '#8574d6'
    mass: 0.09
  goals:
  - label: A in its outline
    object: a
    type: place
    at:
    - 0.1
    - 0.25
    - 0.025
    tolerance:
    - 0.028
    - 0.028
    - 0.01
    upright: true
    destination: outline A
  - label: B in its outline
    object: b
    type: place
    at:
    - 0.1
    - 0
    - 0.025
    tolerance:
    - 0.028
    - 0.028
    - 0.01
    upright: true
    destination: outline B
  - label: C in its outline
    object: c
    type: place
    at:
    - 0.1
    - -0.25
    - 0.025
    tolerance:
    - 0.028
    - 0.028
    - 0.01
    upright: true
    destination: outline C
  guided:
    keep:
    - a
    - b
    goal_count: 2
    par: 105
    goal_x: 0.015
    name: Place two blocks
    brief: Use one gripper to place A in outline A, then B in outline B. Move them one at a time.
    placements:
      a:
      - -0.06
      - 0.18
      - 0.025
      b:
      - -0.06
      - 0
      - 0.025
  guide:
    plan:
    - Open one gripper and put the pads around the upper half of A. Keep the gripper body above the table.
      Close, then lift A clear.
    - Carry A over the outline labelled A. Lower it onto the table and open the gripper.
    - Keep the empty gripper open and lift it clear of A. Then use the same gripper to pick up B.
    - Place B in outline B and release it. Both blocks must stay upright and still.
    tips:
    - One gripper means one block at a time. You do not need to hold both blocks together.
    - The letter above each block matches the letter beside its destination. A and B each have their own
      outline.
    - Keep the bulky gripper body above the table. Aim the pads a little above the block’s centre, then
      close around its upper half.
    - If a closed gripper does not lift the block, open it, centre the block between both pads, then close
      again.
    - Lift before moving sideways. If the block scrapes along the table, it can slip out of the gripper.
    - Q lifts the selected gripper and E lowers it while the view has focus. Alt-drag changes the mouse
      movement plane.
    full_plan:
    - Pick up block A with one gripper, lift it, and release it inside outline A.
    - Repeat for B, then C. Each block has its own labelled outline.
    - Keep each released block upright and still while moving the next one.
    full_tips:
    - Lift clear of the other blocks. Letters identify the targets as well as colour.
    stages:
      approach:
        title: Line up with the upper half of {object}
        text: Open the gripper. Put its pads on opposite sides of {object}, a little above the centre.
          Keep the bulky gripper body clear of the table.
