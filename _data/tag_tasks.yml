# Teleoperation practice and Grandma’s tiny-home campaign. Metres and seconds.
title: Teleoperation arcade
subtitle: Start small. Build steady hands. Finish the housework.
levels:
- id: bowl
  name: Ball in the bowl
  hands: 1
  skill: First grasp
  brief: Pick up the blue ball and release it inside the wide bowl. Take your time.
  hint: Close around the ball, lift, move over the opening, then release. A settled ball counts.
  par: 90
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: '#2a78d6'
  - key: bowl
    kind: bowl
    at:
    - 0.04
    - -0.17
