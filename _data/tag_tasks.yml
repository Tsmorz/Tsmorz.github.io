controls:
  intro: AprilTags drive the hands. Drag either hand or gripper with the mouse to take over; scroll on
    it to grip and release. Resume AprilTags gives control back to the tags.
  keyboard: 'Hands: W/S forward/back; A/D sideways; Q/E lift/lower; Space grip; J/K tilt; U/O roll. Move:
    I/K forward/back; J/L turn. Choose Left, Right or Both.'
  scoring: One star for finishing, one for the target time, one for no dropped props. Best results stay
    in this browser.
camera:
  label: First person
  help: Look through your character’s eyes. Tilt up/down with the slider or ↑/↓ while the 3D view is focused.
physics: Rigid props collide and grips can slip. Towels use a coarse deformable mesh with self-contact;
  fabric is an approximation.
story:
  title: Grandma’s little helper
  subtitle: A visit, a few chores, and a pocketful of treats.
  intro: Eli is visiting Grandma for the afternoon. Knock on her door, help around her cosy home, and
    leave with a few of her favourite thank-yous. Pip can help too.
  ending: “All done! Come sit with me, love. There’s a little something in this envelope for you.”
  navigation: Lean your calibrated body tag forward or back to walk or drive; turn your shoulders to steer.
    Stand neutrally to stop. Double-click the floor to travel with the mouse, or use W/S and A/D. Drag
    either hand to reach; scroll on it to grip, Shift-scroll to tilt, Space to release. Settings contains
    camera setup and practice.
  actors:
  - id: robot
    name: Pip, the robot
    description: Pip visits Grandma. Drive an AMR base and help with both grippers.
  - id: teen
    name: Eli, the teenage helper
    description: Eli visits Grandma. Walk to each little chore and lend a hand.
  order:
  - door
  - bowl
  - precision
  - sort
  - tower
  - tray
  - dishwasher
  - laundry
  ui:
    settings: Game settings
    chapter: Chore
    grandma: Grandma
    next: Next chore
    finish: An afternoon well spent
    reward: Grandma gave you
    pocket: In your pocket
    setup: Camera & AprilTags
    return: Back to the game
    retry: Try this chore again
    help: How to play
    view: View
    outside: Room
    eyes: Through their eyes
    tilt: Look up / down
    tags: Resume AprilTags
    empty: Your pocket is empty… for now.
    loading: Loading Eli…
