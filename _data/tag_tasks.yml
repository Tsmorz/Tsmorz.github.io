  guide:
    plan:
    - Pinch the two corners of the same edge, one with each gripper.
    - Lift that edge and carry it across to the opposite edge. Keep the corners aligned.
    - Lower and release both corners. In the small task, fold directly onto the marked pad; no extra carry
      is needed.
    tips:
    - Use both hands on opposite corners of an edge. Lift that edge over the far edge, lower, release,
      then stack. The whole edge must line up.
    - If the jaws close without gripping, open them and centre the prop between both pads before trying
      again.
    - Fabric weight and stretch pull back on the grippers. TacHammer pulses grow with simulated tension;
      open the jaws to release a patch.
    full_plan:
    - Use both grippers to pinch two corners of one towel edge.
    - Fold that edge across to the opposite edge, then lower and release both corners on the stack.
    - Repeat for each towel in the pile.
    full_tips:
    - Use both hands on opposite corners of an edge. Lift that edge over the far edge, lower, release,
      then stack. The whole edge must line up.
controls:
  intro: AprilTags drive the grippers. You can also drag a gripper with the mouse. Scroll down on it to
    close, up to open; Space toggles the selected gripper.
  keyboard: W/S forward/back, A/D sideways, Q/E lift/lower. Space opens/closes. J/K tilt and U/O roll
    the wrist. Alt-drag changes the mouse movement plane. Hold Shift for 0.2 mm steps and fine wrist turns.
  scoring: One star for finishing, one for the target time, one for no dropped props. Best results stay
    in this browser.
camera:
  label: First person
  help: Look through the robot’s head camera. Tilt with the slider or the up/down arrows while the view
    has focus.
physics: Rigid contacts, friction-limited grasps, deformable XPBD fabric and an elastic cable run at 240
  Hz. Cable and fabric loads pull back on the grippers. These are physical approximations; connector forces
  are representative, not measured hardware calibration.
