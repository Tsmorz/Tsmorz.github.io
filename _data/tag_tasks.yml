# Teleoperation level content and physical goal tolerances (metres, seconds). Edit here, not in markup.
---
title: Teleoperation arcade
subtitle: Start small. Build steady hands. Finish the housework.
levels:
- id: bowl
  name: Ball in the bowl
  hands: 1
  skill: First grasp
  brief: Pick up the blue ball and release it inside the wide bowl. Take your time.
  hint: Close around the ball, lift, move over the opening, then release. A settled
    ball counts.
  par: 90
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: "#2a78d6"
  - key: bowl
    kind: bowl
    at:
    - 0.04
    - -0.17
    - 0
    label: Bowl
    color: "#168a73"
    mass: 0.22
  goals:
  - type: inside
    object: ball
    target: bowl
    label: Release the ball in the bowl
- id: precision
  name: A smaller target
  hands: 1
  skill: Precision
  brief: Put the ball inside the mug. The opening is only a little wider than the
    ball.
  hint: Look down through the head camera to line up the opening. Motion × 0.5 helps
    with tags.
  par: 120
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: "#2a78d6"
  - key: cup
    kind: cup
    at:
    - 0.03
    - -0.18
    - 0
    label: Mug
    color: "#2a78d6"
  goals:
  - type: inside
    object: ball
    target: cup
    label: Release the ball in the mug
