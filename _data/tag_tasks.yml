# Robot tasks and guidance. Metres and seconds.
title: Robot tasks
subtitle: Five tasks, from a first grasp to two-handed precision and soft fabric.
levels:
- id: bowl
  name: Ball in the bowl
  hands: 1
  skill: First grasp
  brief: Pick up the blue ball and release it inside the wide bowl. Take your time.
  hint: Close around the ball, lift, move over the opening, then release. A settled
    ball counts.
  par: 90
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: "#2a78d6"
  - key: bowl
    kind: bowl
    at:
    - 0.04
    - -0.17
    - 0
    label: Bowl
    color: "#168a73"
    mass: 0.22
  goals:
  - type: inside
    object: ball
    target: bowl
    label: Release the ball in the bowl
    destination: the bowl
  guided:
    keep:
    - ball
    - bowl
    goal_count: 1
    par: 90
    placements:
      bowl:
      - 0
      - 0.03
      - 0
    name: Ball in the bowl
    brief: Pick up the ball, move it over the bowl, and open the gripper. Let the
      ball settle inside.
  guide:
    plan:
    - Open either gripper and centre the ball between its two pads.
    - Close until the ball stays between the pads. Lift it clear of the table.
    - Move over the bowl, lower just above the opening, then open the gripper.
    tips:
    - Close around the ball, lift, move over the opening, then release. A settled
      ball counts.
    - If the jaws close without gripping, open them and centre the prop between both
      pads before trying again.
- id: sort
  name: Place two blocks
  hands: 1
  skill: Placement
  brief: Use one gripper to place A in outline A, then B in outline B. Release each
    block and lift clear before picking up the next.
  hint: Lift clear of the other blocks. Letters identify the targets as well as colour.
  par: 150
  objects:
  - key: a
    kind: block
    at:
    - -0.12
    - 0.25
    - 0.025
    label: A
    color: "#2a78d6"
    mass: 0.09
  - key: b
    kind: block
    at:
    - -0.12
    - 0
    - 0.025
    label: B
    color: "#168a73"
    mass: 0.09
  goals:
  - label: A in its outline
    object: a
    type: place
    at:
    - 0.1
    - 0.25
    - 0.025
    tolerance:
    - 0.028
    - 0.028
    - 0.01
    upright: true
    destination: outline A
  - label: B in its outline
    object: b
    type: place
    at:
    - 0.1
    - 0
    - 0.025
    tolerance:
    - 0.028
    - 0.028
    - 0.01
    upright: true
    destination: outline B
  guided:
    keep:
    - a
    - b
    goal_count: 2
    par: 105
    goal_x: 0.015
    name: Place two blocks
    brief: Use one gripper to place A in outline A, then B in outline B. Move them
      one at a time.
    placements:
      a:
      - -0.06
      - 0.18
      - 0.025
      b:
      - -0.06
      - 0
      - 0.025
  guide:
    plan:
    - Open one gripper and put the pads around the upper half of A. Keep the gripper
      body above the table. Close, then lift A clear.
    - Carry A over the outline labelled A. Lower it onto the table and open the gripper.
    - Keep the empty gripper open and lift it clear of A. Then use the same gripper
      to pick up B.
    - Place B in outline B and release it. Both blocks must stay upright and still.
    tips:
    - One gripper means one block at a time. You do not need to hold both blocks together.
    - The letter above each block matches the letter beside its destination. A and
      B each have their own outline.
    - Keep the bulky gripper body above the table. Aim the pads a little above the
      block’s centre, then close around its upper half.
    - If a closed gripper does not lift the block, open it, centre the block between
      both pads, then close again.
    - Lift before moving sideways. If the block scrapes along the table, it can slip
      out of the gripper.
    - Q lifts the selected gripper and E lowers it while the view has focus. Alt-drag
      changes the mouse movement plane.
    full_plan:
    - Open one gripper and put the pads around the upper half of A. Keep the gripper
      body above the table. Close, then lift A clear.
    - Carry A over the outline labelled A. Lower it onto the table and open the gripper.
    - Keep the empty gripper open and lift it clear of A. Then use the same gripper
      to pick up B.
    - Place B in outline B and release it. Both blocks must stay upright and still.
    full_tips:
    - The full challenge puts the two targets farther away. Both blocks must stay
      upright and still.
    stages:
      approach:
        title: Line up with the upper half of {object}
        text: Open the gripper. Put its pads on opposite sides of {object}, a little
          above the centre. Keep the bulky gripper body clear of the table.
  revision: 2
- id: tray
  name: Balance a loaded tray
  hands: 2
  skill: Carry together
  brief: Grip both side rims, lift the loaded tray and hold it level for one second.
    Set it on its outline without the ball touching a rim.
  hint: Move both grippers gently together. If the ball hits a side, restart and try
    a slower, more level lift.
  par: 240
  objects:
  - key: tray
    kind: tray
    at:
    - -0.105
    - 0
    - 0.006
    label: Tray
    color: "#168a73"
    mass: 0.35
  - key: ball
    kind: ball
    at:
    - -0.105
    - 0
    - 0.038
    label: Ball
    color: "#2a78d6"
  goals:
  - type: balance
    object: tray
    label: Lift with both hands and balance for one second
  - label: Set the tray down and release both grippers
    object: tray
    type: place
    at:
    - 0.115
    - 0
    - 0.006
    tolerance:
    - 0.026
    - 0.035
    - 0.012
    dual: true
    upright: true
    destination: the tray outline
  - type: aboard
    object: ball
    target: tray
    label: Keep the ball clear of every rim
    destination: the centre of the tray
  guided:
    keep:
    - tray
    - ball
    goal_count: 3
    par: 168
    name: Balance a loaded tray
    goal_x: 0.015
    brief: Grip both side rims, lift the loaded tray and hold it level for one second.
      Set it on its outline without the ball touching a rim.
  guide:
    plan:
    - Centre one open gripper on each side rim of the tray, away from the ball. Close
      both around the rims.
    - Select both grippers (3). Raise them gently together until the lift objective
      is checked; hold level for one second.
    - Carry the tray to its outline slowly, lower evenly, then open both grippers.
      The ball must never touch a side.
    tips:
    - Watch the ball, not just the tray. Small wrist tilts make the ball roll.
    - If the ball hits a rim or falls off, choose Restart task. A new attempt starts
      with the ball centred.
    - Select 3 to move both hands together. Use small movements and keep both wrists
      at the same height.
    stages:
      tray_lift:
        title: Lift both rims evenly
        text: Both grippers are holding the tray. Raise them together gently; keep
          the ball away from every rim.
      tray_hold:
        title: Hold the tray level
        text: Keep both grippers still for one second. Watch the ball and make small
          wrist corrections before it rolls toward a rim.
      tray_move:
        title: Lower onto the tray outline
        text: The clean lift is complete. Move slowly over the outline, lower evenly
          and release both grippers. Keep the ball clear of the sides.
      tray_retry:
        title: Ball touched a rim — restart
        text: This attempt cannot finish. Set the tray down, then choose Restart task.
          Lift more slowly and keep both wrists level next time.
  revision: 2
  balance:
    tray: tray
    ball: ball
    min_height: 0.07
    seconds: 1.0
- id: cable
  revision: 2
  name: Charge the Samsung phone
  hands: 2
  skill: Two-handed cable assembly
  brief: Plug the charger into the outlet. Then hold the Samsung phone in one gripper
    and connect its USB-C cable with the other.
  hint: Use the right gripper for the charger and USB-C housing, and the left for
    the phone. Keep a loose cable loop; align the connector with the phone’s bottom
    edge.
  par: 300
  objects:
  - key: charger
    kind: charger
    at:
    - -0.045
    - -0.2
    - 0.029
    mass: 0.085
    label: Phone charger
    color: "#e3e5e7"
    mat: aluminium
    slop: 5.0e-05
  - key: outlet
    kind: outlet
    at:
    - 0.06
    - -0.22
    - 0.1
    mass: 0.3
    fixed: true
    label: Power outlet
    color: "#b7bdc4"
    mat: aluminium
    slop: 5.0e-05
    show_label: true
  - key: phone
    kind: phone
    at:
    - 0.005
    - 0.18
    - 0.0445
    mass: 0.185
    label: Samsung Galaxy phone
    color: "#252b32"
    mat: aluminium
    slop: 5.0e-05
    show_label: true
  - key: plug
    kind: usb-plug
    at:
    - -0.07
    - -0.025
    - 0.0675
    label: USB-C plug
    color: "#30363e"
    mass: 0.025
    mat: rubber
    slop: 5.0e-05
  - key: rest
    kind: plug-rest
    at:
    - -0.07
    - -0.025
    - 0
    fixed: true
    label: Cable cradle
    color: "#6f7985"
    mat: aluminium
  - key: phone-rest
    kind: phone-rest
    at:
    - 0.005
    - 0.18
    - 0
    fixed: true
    label: Phone cradle
    color: "#6f7985"
    mat: aluminium
  cables:
  - key: wire
    label: Phone charging cable
    plug: plug
    anchor_body: charger
    anchor_local:
    - -0.02
    - 0
    - -0.018
    length: 0.6
    mass: 0.025
    radius: 0.0016
    resolution: 65
    bend_stiffness: 2.0e-05
    color: "#242a32"
    loop_direction: -1
  goals:
  - type: power
    object: charger
    target: outlet
    label: Seat and release the charger in the outlet
    destination: the power outlet
  - type: charge
    object: plug
    target: phone
    label: Connect USB-C while holding the phone in the other gripper
    destination: the phone’s USB-C socket
  charging:
    charger: charger
    outlet: outlet
    phone: phone
    plug: plug
    socket_at:
    - -0.078
    - 0
    - 0
  camera:
    at:
    - 0
    - 0
    - 0.14
    offset:
    - 0.8
    - -0.75
    - 0.55
  markers: []
  guide:
    plan:
    - Use the right gripper to grasp the charger body. Lift it, align both round pins
      with the outlet and push straight in. Open the gripper once it seats.
    - Use the left gripper around the lower half of the Samsung phone on its cradle.
      Lift it clear and keep its screen facing up.
    - With the right gripper, pinch the rear half of the USB-C housing on its cradle.
      Lift it without pulling the cable taut.
    - Bring the plug straight toward the socket in the phone’s bottom edge. Hold the
      phone steady with the left gripper and adjust the right wrist in fine steps.
    - Once connected, open the plug gripper while continuing to hold the phone. Keep
      both connections still until the charging objective completes.
    tips:
    - Lift the phone straight up and keep it toward the left shoulder while the right
      gripper picks up the cable. Lift the empty cable gripper clear before moving
      sideways.
    - The socket moves with the phone. Insertion force pushes back on both hands;
      a phone left on the table cannot satisfy the two-handed objective.
    - Both cable ends move with their attached objects. The jacket bends, drags, collides
      and develops tension; move the objects closer if the cable pulls them off axis.
    - Keep the phone screen up and its bottom edge toward the robot. Leave room between
      both grippers for the metal connector nose.
    - Shift + W/A/S/D/Q/E moves in 0.2 mm steps. Shift + J/K/U/O turns the wrist finely.
      Motion × 0.1 helps with AprilTags.
    - TacHammer pulses indicate impacts and changes in load. One knock marks a seating
      event. This is a simulated outlet and charger.
    stages:
      done:
        title: Phone charging complete
        text: Both connections are seated. You connected USB-C while holding the phone
          with the other gripper. You can set the phone down or try again.
- id: laundry
  revision: 3
  name: Fold a fluffy towel
  hands: 2
  skill: Two folds in soft fabric
  ready:
    offset: [0.04, 0.02, 0.12]
    pitch: 0
  brief: Fold the far edge toward you and release it. Regrip both layers of the aligned
    open edge, fold them back onto the crease and release a four-layer stack.
  hint: Release between folds. On the second grasp, centre the pads around both aligned
    open edges, then lift and turn them back toward the crease.
  par: 360
  objects: []
  cloths:
  - key: towel
    kind: towel
    label: Fluffy towel
    at:
    - -0.09
    - 0
    - 0
    width: 0.24
    height: 0.32
    resolution: 13
    iterations: 10
    mass: 0.06
    thickness: 0.006
    pile: 0.0025
    bend_compliance: 20.0
    color: "#c5b49a"
    fold_axes: xx
  goals:
  - type: fold
    object: towel
    folds: 2
    label: Two folds, four layers, released and settled
    at:
    - -0.14
    - 0
    - 0.025
    tolerance:
    - 0.065
    - 0.065
    - 0.045
    destination: the folding pad
  markers:
  - at:
    - -0.14
    - 0
    - 0.001
    size:
    - 0.12
    - 0.35
    label: Four-layer towel
  guided:
    name: Fold a fluffy towel
    brief: Fold the far edge toward you and release it. Regrip both layers of the
      aligned open edge, fold them back onto the crease and release a four-layer stack.
    par: 360
    goals:
    - type: fold
      object: towel
      folds: 2
      label: Two folds, four layers, released and settled
      at:
      - -0.14
      - 0
      - 0.025
      tolerance:
      - 0.08
      - 0.075
      - 0.05
      destination: the folding pad
  camera:
    at:
    - -0.09
    - 0
    - 0.055
    offset:
    - 0.8
    - -0.8
    - 0.65
  guide:
    plan:
    - Pinch the two labelled far corners, one per gripper. Lift them and bring the
      far edge toward you onto the near edge. Lower and release both grippers.
    - Lift the open grippers clear. Regrip both layers at each labelled end of the
      aligned open edge. Centre the pads between the two layers.
    - Lift the doubled open edge and bring it back onto the crease, keeping the grippers
      facing down. Lower gently and release to leave four layers on the pad.
    - Open both grippers and lift clear. Let the towel settle; a single fold or a
      crumpled bundle will not finish.
    tips:
    - The towel has a soft fabric core, a thick plush nap and clearly visible edges. Aim
      the pads around its edge, with the palm above the table.
    - For the second fold, the grab labels sit between the two open edges. Centre
      the gripper there so it catches both layers, not just the top corner.
    - Keep the jaws facing down for both folds. Select 3 to move both hands together;
      use Q/E to lift and lower. You can complete this task without turning the wrists.
    - Release and regrip between folds. If an edge slips, open the jaws, centre the
      doubled edge and close again.
    labels:
      target: Line up here
      first: First fold corner
      second: Second fold corner
    stages:
      towel_first_grab:
        title: Pinch the two far corners
        text: Use one gripper at each labelled corner of the far edge. Close around
          a small patch and keep the palm above the towel.
      towel_first_move:
        title: Bring the far edge toward you
        text: Lift both far corners and bring them onto the near corners. Keep the
          jaws facing down and lower gently before releasing.
      towel_first_release:
        title: Release the first fold
        text: The opposite edges line up. Open both grippers and lift clear, leaving
          the towel folded in half.
      towel_second_grab:
        title: Grip both aligned open edges
        text: Pinch both towel layers at each labelled end of the open edge. Centre
          the pads between the layers before closing.
      towel_second_move:
        title: Bring the doubled edge back to the crease
        text: Lift both layers of the open edge and bring them back onto the labelled
          crease. Keep the jaws down, lower gently and open both grippers.
      towel_release:
        title: Release the four-layer towel
        text: Both folds line up. Open both grippers and lift clear. The four-layer
          stack must stay compact and settle on its pad.
      towel_tidy:
        title: Line up the final fold
        text: Regrip both layers at the labelled open edge and bring them onto the crease.
          Lower gently, release and let the four layers settle.
      towel_repair:
        title: Line up the first fold again
        text: The first fold slipped open. Line up its two open edges again before
          making the second fold.
      towel_layers:
        title: Catch both towel layers
        text: A gripper has only the top layer. Open it, lower the pads around both
          aligned edges, then close again. Pulling one layer would open the first
          fold.
navigation:
  calibrate: Calibrate
  tracking: Tracking
  tasks: Tasks
controls:
  scene_label: '3D view: the robot the tags drive, or each tag''s recent positions
    and orientations. Drag to orbit, scroll to zoom, arrow keys to orbit (in Robot
    eyes: up/down lift/lower the selected gripper, left/right move it sideways), 1/2/3
    select left/right/both grippers, F to fit, R to reset the view, C to calibrate
    the robot, T to reset the table, M to turn its sound on or off. Drag a robot hand
    to move it across the view (Alt for the other way), scroll on it to open and close
    its gripper (Shift to tilt it), Space to open or close it.'
  intro: AprilTags drive the grippers. You can also drag a gripper with the mouse.
    Scroll down on it to close, up to open; Space toggles the selected gripper.
  keyboard: Click a gripper to select it, or press 1 for left, 2 for right, 3 for
    both. W/S forward/back, A/D sideways, Q/E lift/lower. In Robot eyes, ↑/↓ lift/lower
    and ←/→ move sideways. Space opens/closes. J/K tilt forward/back, I/P tilt sideways
    and U/O roll the wrist. Alt-drag changes the mouse movement plane. Hold Shift
    for 0.2 mm steps and fine wrist turns.
  scoring: One star for finishing, one for the target time, one for no dropped props.
    Best results stay in this browser.
camera:
  label: First person
  help: Look through the robot’s wide head camera. Tilt with the slider. With the
    view focused, ↑/↓ lift/lower the selected gripper and ←/→ move it sideways.
physics: Rigid contacts, friction-limited grasps, deformable XPBD fabric and an elastic
  cable run at 240 Hz. Cable and fabric loads pull back on the grippers. These are
  physical approximations; connector forces are representative, not measured hardware
  calibration.
