      detail: "Rotate the outside camera right. In Robot eyes, move the selected gripper right instead."
    mouse_left:
      title: "Drag gripper / look around"
      detail: "Drag a gripper to move it in the plane facing the camera. Drag empty space to orbit the outside view, or look up/down in Robot eyes."
    mouse_right:
      title: "Pan outside camera"
      detail: "Right-drag or middle-drag pans the outside camera. Shift-drag does the same."
    mouse_wheel:
      title: "Grip / zoom / head tilt"
      detail: "Over a gripper, wheel down closes and up opens; Shift-wheel tilts the wrist. Over empty space, zoom the outside view or tilt the head in Robot eyes. Press and drag the wheel to pan the outside view."
    mouse_gesture:
      title: "Fit / touch zoom"
      detail: "Double-click fits the outside view. Pinch with two fingers zooms the outside view; Robot eyes uses vertical dragging for head tilt."
physics: Rigid contacts, friction-limited grasps, deformable XPBD fabric and an elastic
  cable run at 240 Hz. Cable and fabric loads pull back on the grippers. These are
  physical approximations; connector forces are representative, not measured hardware
  calibration.
