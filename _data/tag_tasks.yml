    plan:
    - Move one open gripper to each side rim of the tray. Close both around the rims.
    - Lift both grippers together and keep the tray level.
    - Move the tray over its outline, lower both grippers, and release both. Keep the ball on board.
    tips:
    - Pinch opposite rims, then choose Both to move the hands together. Keep the tray level.
    - If the jaws close without gripping, open them and centre the prop between both pads before trying
      again.
