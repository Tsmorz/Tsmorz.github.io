    - 0.18
    - 0.0445
    mass: 0.185
    label: Samsung Galaxy phone
    color: '#252b32'
    mat: aluminium
    slop: 5.0e-05
    show_label: true
  - key: plug
    kind: usb-plug
    at:
    - -0.07
    - -0.025
    - 0.0675
    label: USB-C plug
    color: '#30363e'
    mass: 0.025
    mat: rubber
    slop: 5.0e-05
  - key: rest
    kind: plug-rest
    at:
    - -0.07
    - -0.025
    - 0
    fixed: true
    label: Cable cradle
    color: '#6f7985'
    mat: aluminium
  - key: phone-rest
    kind: phone-rest
