- id: handoff
  name: Pass it on
  hands: 2
  skill: Hand coordination
  brief: Grasp the ball with each hand in turn, then put it in the bowl.
  hint: The receiving hand closes before the other opens. With one mouse, switch Left
    / Right between moves.
  par: 180
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: "#2a78d6"
  - key: bowl
    kind: bowl
    at:
    - 0.05
    - -0.2
    - 0
    label: Bowl
    color: "#168a73"
    mass: 0.22
  goals:
  - type: inside
    object: ball
    target: bowl
    handoff: true
    label: Both hands grasped the ball; ball in bowl
