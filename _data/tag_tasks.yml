# Robot tasks and guidance. Metres and seconds.
title: Robot tasks
subtitle: Five tasks, from a first grasp to two-handed precision and soft fabric.
# Shared idle joint angles in degrees, in RobotCore.JOINTS order: elbows by the sides,
# forearms and fingers forward, with the jaws opening sideways. Right arm is mirrored.
ready:
  joints: [0, 0, 0, 90, 0, 0, 0]
levels:
- id: bowl
  name: Ball in the bowl
  hands: 1
  skill: First grasp
  brief: Pick up the ball, move it over the bowl, and open the gripper. Let the ball settle inside.
  hint: Close around the ball, lift, move over the opening, then release. A settled ball counts.
  par: 90
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: '#2a78d6'
  - key: bowl
    kind: bowl
    at:
    - 0
    - 0.03
    - 0
    label: Bowl
    color: '#168a73'
    mass: 0.22
  goals:
  - type: inside
    object: ball
    target: bowl
    label: Release the ball in the bowl
    destination: the bowl
  guide:
    plan:
    - Open either gripper and centre the ball between its two pads.
    - Close until the ball stays between the pads. Lift it clear of the table.
    - Move over the bowl, lower just above the opening, then open the gripper.
    tips:
    - Close around the ball, lift, move over the opening, then release. A settled ball counts.
    - If the jaws close without gripping, open them and centre the prop between both pads before trying
      again.
  cloths: []
  revision: 2
- id: sort
  name: Place two blocks
  hands: 1
  skill: Placement
  brief: Use one gripper to place A in outline A, then B in outline B. Move them one at a time.
  hint: Lift clear of the other blocks. Letters identify the targets as well as colour.
  par: 105
  objects:
  - key: a
    kind: block
    at:
    - -0.06
    - 0.18
    - 0.025
    label: A
    color: '#2a78d6'
    mass: 0.09
  - key: b
    kind: block
    at:
    - -0.06
    - 0
    - 0.025
    label: B
    color: '#168a73'
    mass: 0.09
  goals:
  - label: A in its outline
    object: a
    type: place
    at:
    - 0.015
    - 0.25
    - 0.025
    tolerance:
    - 0.028
    - 0.028
    - 0.01
    upright: true
    destination: outline A
  - label: B in its outline
    object: b
    type: place
    at:
    - 0.015
    - 0
    - 0.025
    tolerance:
    - 0.028
    - 0.028
    - 0.01
    upright: true
    destination: outline B
  guide:
    plan:
    - Open one gripper and put the pads around the upper half of A. Keep the gripper body above the
      table. Close, then lift A clear.
    - Carry A over the outline labelled A. Lower it onto the table and open the gripper.
    - Keep the empty gripper open and lift it clear of A. Then use the same gripper to pick up B.
    - Place B in outline B and release it. Both blocks must stay upright and still.
    tips:
    - One gripper means one block at a time. You do not need to hold both blocks together.
    - The letter above each block matches the letter beside its destination. A and B each have their
      own outline.
    - Keep the bulky gripper body above the table. Aim the pads a little above the block’s centre,
      then close around its upper half.
    - If a closed gripper does not lift the block, open it, centre the block between both pads, then
      close again.
    - Lift before moving sideways. If the block scrapes along the table, it can slip out of the gripper.
    - Q lifts the selected gripper and E lowers it while the view has focus. Alt-drag changes the
      mouse movement plane.
    stages:
      approach:
        title: Line up with the upper half of {object}
        text: Open the gripper. Put its pads on opposite sides of {object}, a little above the centre.
          Keep the bulky gripper body clear of the table.
  revision: 3
  cloths: []
- id: tray
  name: Balance a loaded tray
  hands: 2
  skill: Carry together
  brief: Grip both side rims, lift the loaded tray and hold it level for one second. Set it on its
    outline without the ball touching a rim.
  hint: Move both grippers gently together. If the ball hits a side, restart and try a slower, more
    level lift.
  par: 168
  objects:
  - key: tray
    kind: tray
    at:
    - -0.105
    - 0
    - 0.006
    label: Tray
    color: '#168a73'
    mass: 0.35
  - key: ball
    kind: ball
    at:
    - -0.105
    - 0
    - 0.038
    label: Ball
    color: '#2a78d6'
  goals:
  - type: balance
    object: tray
    label: Lift with both hands and balance for one second
  - label: Set the tray down and release both grippers
    object: tray
    type: place
    at:
    - 0.015
    - 0
    - 0.006
    tolerance:
    - 0.026
    - 0.035
    - 0.012
    dual: true
    upright: true
    destination: the tray outline
  - type: aboard
    object: ball
    target: tray
    label: Keep the ball clear of every rim
    destination: the centre of the tray
  guide:
    plan:
    - Centre one open gripper on each side rim of the tray, away from the ball. Close both around
      the rims.
    - Select both grippers (3). Raise them gently together until the lift objective is checked; hold
      level for one second.
    - Carry the tray to its outline slowly, lower evenly, then open both grippers. The ball must never
      touch a side.
    tips:
    - Watch the ball, not just the tray. Small wrist tilts make the ball roll.
    - If the ball hits a rim or falls off, choose Restart task. A new attempt starts with the ball
      centred.
    - Select 3 to move both hands together. Use small movements and keep both wrists at the same height.
    stages:
      tray_lift:
        title: Lift both rims evenly
        text: Both grippers are holding the tray. Raise them together gently; keep the ball away from
          every rim.
      tray_hold:
        title: Hold the tray level
        text: Keep both grippers still for one second. Watch the ball and make small wrist corrections
          before it rolls toward a rim.
      tray_move:
        title: Lower onto the tray outline
        text: The clean lift is complete. Move slowly over the outline, lower evenly and release both
          grippers. Keep the ball clear of the sides.
      tray_retry:
        title: Ball touched a rim — restart
        text: This attempt cannot finish. Set the tray down, then choose Restart task. Lift more slowly
          and keep both wrists level next time.
  revision: 3
  balance:
    tray: tray
    ball: ball
    min_height: 0.07
    seconds: 1.0
  cloths: []
- id: pour
  revision: 3
  name: Pour a Weissbier
  hands: 1
  skill: Steady pouring from a bottle
  brief: Lift the Weissbier bottle by its neck and pour it all into the mug without spilling. Stand
    the bottle back up on the table.
  hint: Grip the neck from above and pour sideways with I/P, slowly, keeping the stream in the mug.
  par: 120
  objects:
  - key: bottle
    kind: bottle
    at:
    - -0.03
    - 0.02
    - 0
    mass: 0.3
    label: Weissbier bottle
    artwork:
      title: Münchener Weißbier
      lettering: assets/weissbier-lettering.svg
    color: '#5a3514'
    mat: ceramic
    show_label: true
  - key: mug
    kind: stein
    at:
    - -0.03
    - 0.2
    - 0
    R:
    - 0
    - -1
    - 0
    - 1
    - 0
    - 0
    - 0
    - 0
    - 1
    mass: 0.25
    label: Bavarian stein
    color: '#e9e3d2'
    mat: ceramic
    show_label: true
  pour:
    from: bottle
    to: mug
    litres: 0.5
    spill_limit: 0.05
    color: '#e0a33c'
    foam: '#f3ead6'
  goals:
  - type: pour
    object: bottle
    target: mug
    empty: 0.05
    label: Pour it all into the mug, spill under 5%, stand the bottle back up
    destination: the mug
  camera:
    at:
    - 0
    - 0.11
    - 0.1
    offset:
    - 0.75
    - -0.8
    - 0.65
  markers: []
  guide:
    labels:
      grab: Grab the neck
      target: Pour into here
    plan:
    - Lift the gripper well above the bottle, open it and come down over the neck with the pads either
      side of it. Close.
    - Lift the bottle until its base clears the mug's rim, and carry it over so the neck is above
      the mug.
    - Tilt sideways slowly with I/P. The beer reaches the mouth at about 75 degrees; keep the stream
      in the mug and follow it with the hand as the bottle empties.
    - Stand the bottle back up, carry it clear of the mug, lower it onto the table and open the gripper.
    tips:
    - The palm is wider than the neck is long. Grip high on the neck, with the palm just above the
      cap.
    - Pour outward, toward the mug on the robot's left. Rolling the other way runs the forearm into
      its stop. Turn back, then reposition the bottle.
    - A bottle glugs. Tilting further than the neck can pass only moves the stream; it doesn't pour
      faster.
    - The beer stays level as the bottle turns, and a quick start or stop sloshes it. Spilling more
      than 5% ends the attempt; press Restart task to try again.
    - Shift + I/P turns the wrist in fine steps.
    stages:
      pour_grab:
        title: Grab the bottle by its neck
        text: Come down over the marked neck with the gripper open, pads either side of it, and close.
      pour_lift:
        title: Lift it upright
        text: Raise the bottle straight up until its base clears the mug's rim.
      pour_move:
        title: Carry it over the mug
        text: Carry it smoothly until the neck is above the mug's opening.
      pour_tilt:
        title: Tilt slowly to pour
        text: Tilt sideways with I/P until the beer runs into the mug. Keep the stream in the mug
          and tilt further as the bottle empties.
      pour_set_down:
        title: Stand the bottle back up
        text: Turn it upright, carry it clear of the mug, lower it onto the table and open the gripper.
      pour_spilled:
        title: Too much beer spilled
        text: More than 5% reached the table. Press Restart task to refill the bottle and try again.
      done:
        title: Poured without spilling
        text: The Weissbier is in the mug and the bottle is standing on the table.
- id: laundry
  revision: 4
  name: Fold a T-shirt
  hands: 2
  skill: Fold thin cotton fabric
  brief: Fold each sleeve inward, then bring the two hem corners up to the shoulders. Release the
    shirt on the folding pad.
  hint: Pinch a marked cuff, fold the sleeve onto the body and release. Then use both grippers to
    bring the hem up to the shoulders.
  par: 240
  objects: []
  cloths:
  - key: shirt
    kind: shirt
    label: Cotton T-shirt
    at:
    - -0.07
    - 0
    - 0
    width: 0.28
    height: 0.4
    body_span: 0.22
    resolution: 17
    iterations: 10
    mass: 0.035
    thickness: 0.002
    pile: 0
    bend_compliance: 30.0
    bend_memory: 2
    color: '#536f95'
  goals:
  - type: fold
    object: shirt
    label: Sleeves tucked, hem folded up, released and settled
    at:
    - -0.035
    - 0
    - 0.015
    tolerance:
    - 0.1
    - 0.12
    - 0.04
    destination: the folding pad
  markers:
  - at:
    - -0.035
    - 0
    - 0.001
    size:
    - 0.19
    - 0.25
    label: Folded T-shirt
  camera:
    at:
    - -0.09
    - 0
    - 0.055
    offset:
    - 0.8
    - -0.8
    - 0.65
  guide:
    plan:
    - Pinch the marked cuff with either gripper. Lift it just clear of the table and lay the sleeve
      inward over the shirt body. Open and lift clear.
    - Repeat with the other sleeve. Keep the thin cotton spread flat rather than pulling it into a
      bundle.
    - Use one open gripper at each marked hem corner. Close around the fabric, lift, and bring both
      corners up to the shoulders.
    - Lower gently, open both grippers and lift clear. Let the folded shirt settle on its pad.
    tips:
    - The shirt is thin cotton with no plush pile. Tilt the tips down toward the table; the cuffs and hem corners are the grab points.
    - Use a low movement sensitivity for small corrections. Keep the palm above the table and put
      only the gripper tips around the fabric.
    - Release each sleeve before taking the next fold. Open fully and reposition if a grip slips.
    labels:
      left_cuff: Fold this sleeve
      right_cuff: Fold this sleeve
      hem: Grab this hem corner
      target: Bring it here
    stages:
      shirt_left:
        title: Fold the first sleeve inward
        text: Pinch the marked cuff, lift it slightly and lay the sleeve over the shirt body. Open
          and lift clear.
      shirt_right:
        title: Fold the other sleeve inward
        text: Pinch the other marked cuff and lay its sleeve over the body. Release it before taking
          the hem.
      shirt_sleeve_release:
        title: Release the folded sleeve
        text: Open the gripper and lift clear so the sleeve rests flat on the shirt body.
      shirt_hem:
        title: Take both hem corners
        text: Put one gripper at each marked hem corner and close around the thin fabric.
      shirt_fold:
        title: Bring the hem up to the shoulders
        text: Lift the two hem corners together, carry them toward the shoulders and lower them onto
          the shirt.
      shirt_release:
        title: Release the folded T-shirt
        text: Open both grippers and lift clear. Leave the sleeves tucked and the hem aligned with
          the shoulders.
