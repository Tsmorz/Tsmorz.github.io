  test_unavailable: Connect the device, enable Haptics and select Left or Right hand first.
  capture_status: Capture USB · IMU orientation and TacHammer
  calibrating: Task feedback pauses while the capture gyro calibrates.
  label: TacHammer task feedback
  strength: Peak drive level
  help: Sharp TacHammer clicks grow with impact force. Wrist stops give a crisp limit cue. Low rumble
    follows the current force while moving and fades quickly to a slight buzz at rest.
    Peak drive sets the maximum (75% by default). Test pulse uses that selected peak.
    ERM and gripper-servo commands are not sent.
  routing: Haptic hand
  sides:
  - From wrist tag
  - Left hand
  - Right hand
  - 'Off'
  routing_help: Connect nrf-controller boards with Controller on the task screen.
    Give each board a hand under Haptics to, or From wrist tag when AprilTags drive. The
    board must report TacHammer ready.
  'off': TacHammer feedback off
  disconnected: No controllers connected
  unavailable: Waiting for a controller with TacHammer ready
  ready: TacHammer ready. Move a mapped hand into contact.
  sent: TacHammer command acknowledged
  error: A controller write failed. Reconnect the controller.
