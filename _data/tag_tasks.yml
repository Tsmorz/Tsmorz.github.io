controls:
  intro: Play with tags, drag the grippers, or use the hand controls. There is no
    time limit. All levels are available to practise.
  keyboard: W/S forward/back; A/D sideways; Q/E lift/lower; Space grip; J/K tilt; U/O roll.
    Use Left, Right or Both below.
  scoring: One star for finishing, one for the target time, one for no dropped props.
    Best results stay in this browser.
camera:
  label: Robot eyes
  help: A camera mounted on the robot’s head. Tilt up/down with the slider or ↑/↓
    while the 3D view is focused.
physics: Rigid props collide and grips can slip. Towels use a coarse deformable mesh
  with self-contact; fabric is an approximation.
