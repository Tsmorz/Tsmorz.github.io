controls:
  scene_label: >-
    3D view: the robot the tags drive, or each tag's recent positions and orientations. Drag to orbit, scroll to zoom, arrow keys to orbit (in Robot eyes: up/down lift/lower the selected gripper, left/right move it sideways), 1/2/3 select left/right/both grippers, F to fit, R to reset the view, C to calibrate the robot, T to reset the table, M to turn its sound on or off. Drag a robot hand to move it across the view (Alt for the other way), scroll on it to open and close its gripper (Shift to tilt it), Space to open or close it.
  intro: AprilTags drive the grippers. You can also drag a gripper with the mouse. Scroll down on it to
    close, up to open; Space toggles the selected gripper.
  keyboard: Click a gripper to select it, or press 1 for left, 2 for right, 3 for both. W/S forward/back,
    A/D sideways, Q/E lift/lower. In Robot eyes, ↑/↓ lift/lower and ←/→ move sideways. Space opens/closes.
    J/K tilt forward/back, I/P tilt sideways and U/O roll the wrist. Alt-drag changes the mouse movement plane. Hold Shift for 0.2 mm steps and fine wrist turns.
  scoring: One star for finishing, one for the target time, one for no dropped props. Best results stay
    in this browser.
camera:
  label: First person
  help: Look through the robot’s wide head camera. Tilt with the slider. With the view focused, ↑/↓ lift/lower
    the selected gripper and ←/→ move it sideways.
physics: Rigid contacts, friction-limited grasps, deformable XPBD fabric and an elastic cable run at 240
  Hz. Cable and fabric loads pull back on the grippers. These are physical approximations; connector forces
  are representative, not measured hardware calibration.
