    object: ball
    target: bowl
    label: Release the ball in the bowl
  story:
    room: Sitting room
    title: A toy left behind
    brief: “Mind that little ball by the table, love. Pop it in the bowl for me.”
    outro: “Lovely. Have a boiled sweet from the tin.”
    keep:
    - ball
    - bowl
    goal_count: 1
    par: 90
    travel:
      half:
