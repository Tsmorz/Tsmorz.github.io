  connect: Connect USB / ESB
  ble: Connect BLE
  baud: Baud
  help: Use BLE, a direct USB controller, or a USB-connected XIAO ESB receiver. USB
    and ESB require TP/1 teleop firmware; its default is 1,000,000 baud. Both routes
    send motion into Filtered tracking and return TacHammer cues. Use Connect capture USB
    for the Haptography capture device. Disconnect it from Haptography first. Choose a hand,
    hold the device still for two seconds, then Set neutral. Turn about the board's up axis
    to yaw, tip the cable end to pitch, or twist around the cable to roll the gripper.
    Wrist rotation stops at its limits; mouse or AprilTags still sets its position.
    Returning to Tasks resumes orientation automatically. Set neutral again after a stream reset
    or if heading drifts. Test pulse checks the TacHammer output.
  unsupported: Web Serial needs Chrome or Edge on a computer and HTTPS or localhost.
  closed: Serial controller disconnected. Connect USB / ESB to choose the port again.
  waiting: Port open. Waiting for controller identity and motion…
  serial: USB serial
  esb: USB → ESB
  rtt: command round trip
  dropped: USB / radio drops
  drive_delay: accepted → I2S start
  missing: Controller stopped streaming. Check its power and connection.
voice:
  title: Voice commands
  source: Microphone
  auto: Automatic (controller, then computer)
  computer: Computer microphone
  help: Press Voice or V, speak a command, then pause or press again to stop. With
    a Bluetooth controller, hold its joystick button to talk and release to send.
    Audio is transcribed locally with Whisper.
  commands: Try “Tasks”, “Tracking”, “Calibrate robot”, “Robot eyes”, “Outside view”,
    “Restart task”, “Next task”, “Fit view” or “Resume AprilTags”. Other speech becomes
    a note.
  transport: Controller audio uses the normal Bluetooth firmware. The separate USB
    / ESB teleoperation image has no microphone stream. Reconnect with Connect Bluetooth
    if an earlier connection did not grant the audio service.
  stop: Stop listening
  cancel: Cancel voice input
