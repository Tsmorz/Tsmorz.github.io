motion:
  drag_axes: [Forward, Side, Up]
  short: Movement
  label: Movement sensitivity
  help: Below 1× gives finer movement; above 1× moves farther. Applies to mouse drags,
    keyboard moves and AprilTag hand movement. Wrist rotation stays 1:1.
  reset: Reset to 1×
guidance:
  mouse: Drag a gripper to reach. Scroll down on it to close and up to open. Space
    toggles the selected gripper. Hold Alt while dragging to change the movement plane.
  stages:
    approach:
      title: Line up the gripper
      text: Open either gripper and move its pads to opposite sides of {object}. The
        prop goes between the pads, not under the palm.
    grip:
      title: Close around {object}
      text: The gripper is close enough. Close it around {object}, then lift a little
        to check that the prop follows.
    retry:
      title: Open and try the grasp again
      text: The jaws closed without holding {object}. Open them first, centre {object}
        between both pads, and close again.
    lift:
      title: Lift {object} clear of the table
      text: The gripper is holding {object}. Lift it a few centimetres before moving
        toward {target}.
    move:
      title: Move {object} above {target}
      text: Keep the jaws closed. Move the held prop over its highlighted destination
        before lowering it.
    orient:
      title: Turn {object} to match its destination
      text: Keep holding it and tilt the wrist. Plates go upright into the rack; blocks,
        books, cups and the tray stay level.
    lower:
      title: Lower {object} gently
      text: You are above {target}. Lower the prop toward its support while keeping
        the jaws closed.
    release:
      title: Open the gripper
      text: Release {object} at {target}. It only counts after the gripper lets go
        and the prop stays still.
    settle:
      title: Let {object} settle
      text: Leave the prop released. Its objective gets a check mark once it is in
        the right position and still.
    wrong:
      title: Put down {held} first
      text: The next prop to move is {object}. Set {held} down, open the gripper,
        then reach for {object}.
    dual:
      title: Grip both side rims
      text: The tray needs both grippers. Put one around each side rim, then lift
        both together without tipping the load.
    handoff:
      title: Let the other gripper take the ball
      text: Bring the other open gripper to the ball. Close it around the ball, then
        open the first gripper.
    fold_grab:
      title: Pinch two corners on one edge
      text: Use one gripper for each corner of the same towel edge. Close each gripper
        on a small patch of fabric.
    fold_move:
      title: Bring that edge to the opposite edge
      text: Lift both corners, carry them across the towel, then lower them to line
        up with the opposite corners.
    fold_release:
      title: Release both corners
      text: Open both grippers. The towel must be folded, compact and resting on the
        marked stack.
    done:
      title: Task complete
      text: All objectives are released and settled. You can retry, choose any task,
        or move to the next one.
    fold_second:
      title: Pinch the other corner
      text: One corner is held. Use the other gripper to pinch the other corner on
        that same edge before lifting.
    clear:
      title: Lift the empty gripper clear of {object}
      text: Keep it open and lift straight up before reaching for {next}. Moving sideways
        too soon can knock the placed prop out of its outline.
    usb_grab:
      title: Grip the rear of the plug housing
      text: Use the right gripper around the back half of {object}. Keep its metal
        nose beyond the fingers. The left gripper can support a slack loop of cable.
    usb_align:
      title: Line up the metal nose
      text: Hold the plug level with {target}. Match the flat opening and approach
        along its axis. Orbit or zoom for a closer look; reduce Motion × for fine
        moves.
    usb_insert:
      title: Advance gently into the socket
      text: The nose is aligned. Move straight forward in small increments. If a wall
        stops it, withdraw slightly and correct the angle rather than forcing it.
    usb_release:
      title: The connector is seated
      text: Open the gripper holding the plug, then release the cable. The connector
        must remain seated and still to finish.
    usb_cable_release:
      title: Release the cable support
      text: The plug is seated and released. Open the other gripper to let go of the
        cable, then leave the connector still.
