    - 0.18
    - 0
    fixed: true
    label: Phone cradle
    color: '#6f7985'
    mat: aluminium
  cables:
  - key: wire
    label: Phone charging cable
    plug: plug
    anchor_body: charger
    anchor_local:
    - -0.02
    - 0
    - -0.018
    length: 0.6
    mass: 0.025
    radius: 0.0016
    resolution: 65
    bend_stiffness: 2.0e-05
    color: '#242a32'
    loop_direction: -1
  goals:
  - type: power
    object: charger
    target: outlet
    label: Seat and release the charger in the outlet
    destination: the power outlet
  - type: charge
    object: plug
    target: phone
    label: Connect USB-C while holding the phone in the other gripper
    destination: the phone’s USB-C socket
  charging:
    charger: charger
    outlet: outlet
    phone: phone
    plug: plug
    socket_at:
    - -0.078
    - 0
    - 0
  camera:
    at:
    - 0
    - 0
    - 0.14
    offset:
    - 0.8
    - -0.75
    - 0.55
  markers: []
  guide:
    plan:
    - Use the right gripper to grasp the charger body. Lift it, align both round pins with the outlet
      and push straight in. Open the gripper once it seats.
    - Use the left gripper around the lower half of the Samsung phone on its cradle. Lift it clear and
      keep its screen facing up.
    - With the right gripper, pinch the rear half of the USB-C housing on its cradle. Lift it without
      pulling the cable taut.
    - Bring the plug straight toward the socket in the phone’s bottom edge. Hold the phone steady with
      the left gripper and adjust the right wrist in fine steps.
    - Once connected, open the plug gripper while continuing to hold the phone. Keep both connections
      still until the charging objective completes.
    tips:
    - Lift the phone straight up and keep it toward the left shoulder while the right gripper picks up
      the cable. Lift the empty cable gripper clear before moving sideways.
    - The socket moves with the phone. Insertion force pushes back on both hands; a phone left on the
      table cannot satisfy the two-handed objective.
    - Both cable ends move with their attached objects. The jacket bends, drags, collides and develops
      tension; move the objects closer if the cable pulls them off axis.
    - Keep the phone screen up and its bottom edge toward the robot. Leave room between both grippers
      for the metal connector nose.
    - Shift + W/A/S/D/Q/E moves in 0.2 mm steps. Shift + J/K/U/O turns the wrist finely. Motion × 0.1
      helps with AprilTags.
    - TacHammer pulses indicate impacts and changes in load. One knock marks a seating event. This is
      a simulated outlet and charger.
    stages:
      done:
        title: Phone charging complete
        text: Both connections are seated. You connected USB-C while holding the phone with the other
          gripper. You can set the phone down or try again.
- id: laundry
  revision: 2
  name: Fold a long-sleeve shirt
  hands: 2
  skill: Deformable objects
  brief: Fold each long sleeve across the torso, then bring the hem up to the shoulders. Release the shirt on the folding pad.
  hint: Fold one sleeve at a time. Keep the shoulders on the table, then use both grippers for the hem.
  par: 600
  objects: []
  cloths:
  - key: shirt
    kind: shirt
    label: Long-sleeve shirt
    at: [-0.055, 0, 0]
    width: 0.28
    height: 0.5
    body_span: 0.18
    resolution: 17
    iterations: 8
    mass: 0.11
    color: '#547fbc'
  goals:
  - type: fold
    object: shirt
    label: Both sleeves tucked in, body folded and released
    at: [0.015, 0, 0.018]
    tolerance: [0.045, 0.045, 0.04]
    destination: the folding pad
  markers:
  - at: [0.015, 0, 0.001]
    size: [0.18, 0.22]
    label: Folded shirt
  guided:
    name: Fold a long-sleeve shirt
    brief: Bring the left sleeve across the torso, then the right sleeve. Fold the hem up to the shoulders and release both grippers.
    par: 600
    goals:
    - type: fold
      object: shirt
      label: Both sleeves tucked in, body folded and released
      at: [0.015, 0, 0.018]
      tolerance: [0.07, 0.06, 0.045]
      destination: the folding pad
  guide:
    plan:
    - Pinch the left cuff. Lift it slightly and turn the wrist as you lay the sleeve across the torso. Release it.
    - Repeat with the right cuff. Keep both sleeves inside the sides of the torso.
    - Pinch the two hem corners, one with each gripper. Lift and fold the hem up to the shoulders, turning both wrists with the fabric.
    - Lower, open both grippers and lift clear. The sleeves and body must stay folded on the pad.
    tips:
    - A closed gripper holds a small patch of fabric, including its direction. Turn the wrist with the fold; fabric no longer swivels freely on a single point.
    - Work just above the table so the rest of the shirt stays supported. Lift higher if a sleeve catches underneath.
    - Click a gripper or press 1 / 2 to select it. Q/E raise/lower, J/K tilt forward/back, I/P tilt sideways and U/O turn the wrist. Press 3 to move both hem corners together.
    - Open the jaws and regrip to change which part of the shirt you hold. A very hard pull can slip out of the pads.
    full_plan:
    - Fold the left sleeve across the torso, release, then repeat with the right sleeve.
    - Take both hem corners, turn the wrists and fold the body up to the shoulders.
    - Release the shirt inside the smaller target and let it settle.
    full_tips:
    - The full challenge uses a tighter placement tolerance. Both sleeves and the hem must stay folded after release.
    labels:
      left_cuff: Left cuff
      right_cuff: Right cuff
      hem: Hem corner
    stages:
      shirt_sleeve_release:
        title: Release the tucked sleeve
        text: Open the gripper holding this sleeve and lift clear. The sleeve should stay inside the torso before the next fold.
      shirt_left:
        title: Fold the left sleeve in
        text: Pinch the left cuff, lift it just clear of the table and lay the long sleeve across the torso. Turn your wrist with the fabric, then release.
      shirt_right:
        title: Fold the right sleeve in
        text: The left sleeve is tucked in. Fold the right cuff across the torso and release it, keeping both sleeves within the sides of the shirt.
      shirt_hem:
        title: Take both hem corners
        text: Both sleeves are in. Pinch the two bottom corners of the torso, one with each gripper.
      shirt_fold:
        title: Bring the hem to the shoulders
        text: Lift the hem and fold it up to the shoulder edge. Turn both wrists with the fabric and lower onto the pad.
      shirt_release:
        title: Release the folded shirt
        text: Open both grippers and lift clear. Both sleeves and the body must remain folded and settle on the pad.
