controls:
  intro: Play with tags, drag the grippers, or use the hand controls. There is no
    time limit. All levels are available to practise.
  keyboard: 'Hands: W/S forward/back; A/D sideways; Q/E lift/lower; Space grip; J/K
    tilt; U/O roll. Move: I/K forward/back; J/L turn. Choose Left, Right or Both.'
  scoring: One star for finishing, one for the target time, one for no dropped props.
    Best results stay in this browser.
camera:
  label: First person
  help: Look through your character’s eyes. Tilt up/down with the slider or ↑/↓ while
    the 3D view is focused.
physics: Rigid props collide and grips can slip. Towels use a coarse deformable mesh
  with self-contact; fabric is an approximation.
story:
  title: Before the doors open
  subtitle: Eight tiny rooms. One small job at a time.
  intro: The neighbourhood workshop opens in an hour. Eli and Pip have eight little
    jobs to finish. Choose who helps, find the workbench, and leave each room ready
    for the next visitor.
  ending: Ready for opening day. Eight small jobs, one workshop brought to life.
  navigation: Move with W/S or I/K; turn with A/D or J/L. Stop at the outlined work
    spot, then choose Hands to reach and grip. Hold the floor controls on a touch
    screen.
  actors:
  - id: robot
    name: Pip, the robot
    description: Drive a compact AMR base. The grippers do the careful work.
  - id: teen
    name: Eli, the teenage helper
    description: Walk between workbenches. Steady hands finish each little job.
