    name: Stack two books
    brief: Stack the two books flat, one at a time. Put the red book down first.
  guide:
    plan:
    - Grip a short edge of the red book. Turn the wrist if the book is wider than the open jaws.
    - Place the red book flat on the marked stack position and release it.
    - Lift the green book, lower it onto the red one, and release it gently.
    tips:
    - A book can be too wide for the jaws in one orientation. Turn the wrist so the jaws close around
      a short edge.
    - Release the lower book before picking up the upper book.
    full_plan:
    - Place A flat on the tower outline and release it.
    - Stack B on A, then C on B, releasing each block before picking up the next.
    - Keep the blocks centred and upright; move slowly near the stack.
    full_tips:
    - Place the bottom block first. Lower gently; the blocks collide and can slide or fall.
- id: handoff
  name: Pass it on
  hands: 2
  skill: Hand coordination
  brief: Grasp the ball with each hand in turn, then put it in the bowl.
  hint: The receiving hand closes before the other opens. With one mouse, switch Left / Right between
    moves.
  par: 180
  objects:
  - key: ball
    kind: ball
    at:
    - -0.09
    - 0.18
    - 0.02
    label: Ball
    color: '#2a78d6'
  - key: bowl
    kind: bowl
    at:
    - 0.05
    - -0.2
    - 0
    label: Bowl
    color: '#168a73'
    mass: 0.22
  goals:
  - type: inside
    object: ball
    target: bowl
    handoff: true
    label: Both hands grasped the ball; ball in bowl
    destination: the bowl
  guided:
    keep:
    - ball
    - bowl
    goal_count: 1
    par: 125
    placements:
      bowl:
      - 0
      - -0.03
      - 0
    name: Pass the ball
    brief: Use each gripper to hold the ball in turn, then release it in the bowl.
  guide:
    plan:
    - Pick up the ball with either gripper.
    - Bring the other open gripper to the ball. Close it before releasing the first.
    - Move the ball over the bowl and release it. Both grippers must have held it.
    tips:
    - The receiving hand closes before the other opens. With one mouse, switch Left / Right between moves.
    - If the jaws close without gripping, open them and centre the prop between both pads before trying
      again.
