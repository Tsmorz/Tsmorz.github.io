- name: ESP32 Cam
  blurb: >-
    Software for a small wrist-worn camera (an ESP32-S3). It streams live video,
    spots printed markers (AprilTags) and measures how far away and how tilted they
    are, focuses itself, and can track which way it's facing. You control it from a
    web page on the camera's own Wi-Fi.
  year: "2026"
  tags: [C++, ESP32, Computer Vision]
  featured: true
  on_cv: false
  links:
