# Taskfile for tsmorz.github.io — a thin wrapper over bundler + script/.
# https://taskfile.dev  ·  run `task` or `task --list` to see everything.
#
# This is the single source of truth for the build and the CI checks: both
# `script/check` and .github/workflows/pages.yml delegate here, so the JS and
# link checks are defined exactly once. No build step for CSS/JS.
#
# Everyday use:
#   task serve                       edit with live reload at http://127.0.0.1:4000
#   task serve -- --port 4001        anything after `--` goes to jekyll
#   task check:fast                  quick data + JS-maths checks, no build (seconds)
#   task check                       everything CI runs; run before pushing
#   task build BASEURL=/subpath      build for a site that lives under a subpath

version: "3"

vars:
  SITE_DIR: _site
  BASEURL: ""   # override on the command line: task build BASEURL=/subpath

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install Ruby gem dependencies (bundle install)
    cmds:
      - bundle install

  serve:
    desc: Serve the site locally at http://127.0.0.1:4000 with live reload
    cmds:
      - script/serve {{.CLI_ARGS}}

  build:
    desc: Build the site into _site/ (production; pass BASEURL=... for a subpath)
    env:
      JEKYLL_ENV: production
    cmds:
      # Always pass --baseurl explicitly (empty by default). Omitting it makes
      # jekyll-github-metadata try to derive the baseurl from GitHub, which fails
      # on the runner ("No repo name found") and, once it succeeds, injects an
      # unwanted /pages/<owner> prefix. Explicit --baseurl sidesteps both.
      - bundle exec jekyll build --baseurl "{{.BASEURL}}"

  check:data:
    desc: Validate _data/*.yml (required fields, project images exist) — no build needed
    cmds:
      - script/test-data

  check:js:
    desc: Verify every assets/js/*.js file is referenced by a built page
    cmds:
      - |
        FAIL=0
        for js in assets/js/*.js; do
          filename=$(basename "$js")
          if ! grep -qr "$filename" {{.SITE_DIR}}/; then
            echo "UNREFERENCED: $js is not loaded by any page in {{.SITE_DIR}}/"
            FAIL=1
          fi
        done
        if [ $FAIL -eq 1 ]; then
          echo "Fix: add a <script src=\"...$filename\"> tag to the page(s) that need it."
          exit 1
        fi
        echo "OK — all JS files are referenced."

  check:swingup:
    desc: Check the swing-up page's JS physics + network against n-cartpole's exported fixture (Node, no build)
    cmds:
      - script/test-swingup

  check:fit:
    desc: Check the CSV, model fit and LQR behind /controls/fit/ (Node, no build)
    cmds:
      - script/test-fit

  check:lab:
    desc: Check the lab template (assets/js/lab/) and every _data/labs page (Node, no build)
    cmds:
      - script/test-lab

  check:links:
    desc: Check internal links with html-proofer
    cmds:
      - bundle exec htmlproofer ./{{.SITE_DIR}} --disable-external --allow-hash-href --ignore-empty-alt

  check:fast:
    desc: "Quick checks, no build: _data content, swing-up port, lab maths, CSV fit"
    cmds:
      - task: check:data
      - task: check:swingup
      - task: check:lab
      - task: check:fit

  check:
    desc: "Everything CI runs: quick checks, then build, JS references, internal links"
    cmds:
      - task: check:fast
      - task: build
      - task: check:js
      - task: check:links

  clean:
    desc: Remove the built site and Jekyll cache
    cmds:
      - rm -rf {{.SITE_DIR}} .jekyll-cache .jekyll-metadata
