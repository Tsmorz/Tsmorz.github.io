<!-- The nav mark (_includes/logo.html, "pendulum4"): a 4x4 checker with violet and lime squares where the swing-up bobs sit.
     Colors follow the browser theme, like the nav: dark squares on light tabs, light ones on dark tabs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 4" shape-rendering="crispEdges">
  <style>
    .a{fill:#1b1b1f} .b{fill:#fff} .v{fill:#5a4fd6} .g{fill:#5fae16}
    @media (prefers-color-scheme: dark) { .a{fill:#e9e9ee} .b{fill:#16161a} .v{fill:#a798ff} .g{fill:#adf45d} }
  </style>
  <rect class="b" width="4" height="4"/>
  <rect class="a" x="0" y="0" width="1" height="1"/>
  <rect class="v" x="2" y="0" width="1" height="1"/>
  <rect class="a" x="1" y="1" width="1" height="1"/>
  <rect class="a" x="3" y="1" width="1" height="1"/>
  <rect class="g" x="0" y="2" width="1" height="1"/>
  <rect class="a" x="2" y="2" width="1" height="1"/>
  <rect class="a" x="1" y="3" width="1" height="1"/>
  <rect class="a" x="3" y="3" width="1" height="1"/>
</svg>
