  <line x1="2" y1="29" x2="30" y2="29" stroke="#8a8f9c" stroke-width="1.5" stroke-linecap="round"/>
  <g transform="translate(4.5 0)">
    <rect x="9.5" y="22.5" width="13" height="6" rx="1.5" fill="#8a929e"/>
    <g stroke="#7d7f94" stroke-width="2.2" stroke-linecap="round">
      <line x1="16.0" y1="26.0" x2="14.8" y2="14.1"/>
