name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # jekyll-github-metadata (pulled in by the github-pages gem) needs the repo
    # name to build; the runner can't always infer it from git, so pass it here.
    env:
      PAGES_REPO_NWO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
        id: pages

      # Validate data + build a plain root site + check it. Link resolution
      # never depends on the deploy base path this way (see CLAUDE.md CI gotchas).
      - name: Validate and check the site
        run: task check

      # Rebuild with the real Pages base path for the artifact that gets deployed.
      - name: Build site for deploy
        run: task build BASEURL="${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
